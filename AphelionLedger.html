<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aphelion Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%232E3542'/%3E%3Ccircle cx='29' cy='32' r='20' fill='none' stroke='%23D2A45B' stroke-width='2.8'/%3E%3Ccircle cx='29' cy='32' r='16.2' fill='none' stroke='%23D2A45B' stroke-width='1.1'/%3E%3Ctext x='29' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='25' fill='%23D2A45B'%3EA%3C/text%3E%3Ccircle cx='50' cy='39' r='8.4' fill='%232E3542'/%3E%3Ccircle cx='51' cy='39' r='6.2' fill='%23D2A45B'/%3E%3C/svg%3E">
<style>
:root{
  /* Aphelion brand */
  --brand:#d2a45b;          /* Aphelion gold - marks, fills, dark grounds */
  --navy:#2e3542;           /* Aphelion navy - the masthead */
  --navy-hi:#3b4353;
  /* supporting: warm sand ground, deep ink, and a slate blue for "in progress" */
  --bg:#f1eee7; --panel:#ffffff; --panel-2:#faf8f3; --border:#e4ded2;
  --text:#23272f; --muted:#77716a;
  --accent:#8a6520;         /* gold darkened enough to read as text on light */
  --accent-soft:#f7efdf;
  --info:#37687f; --info-soft:#e4eef3;
  --green:#1f9d55; --green-soft:#e6f6ec; --amber:#b06f00; --amber-soft:#fdf3e0;
  --red:#c8372d; --red-soft:#fdeceb; --purple:#6b40c4; --purple-soft:#efe9fb;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --brand:#d8ac66; --navy:#242a35; --navy-hi:#2f3746;
    --bg:#161a21; --panel:#1d222b; --panel-2:#232935; --border:#2f3644;
    --text:#e7e3db; --muted:#98a0ac; --accent:#ddb574; --accent-soft:#33291a;
    --info:#6fa5be; --info-soft:#172a33;
    --green:#4ec27f; --green-soft:#16301f; --amber:#e0a34a; --amber-soft:#33270f;
    --red:#ef6a5e; --red-soft:#3a1d1a; --purple:#a58bee; --purple-soft:#26203a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650}
a{color:var(--accent)}

/* ---------- header ---------- */
header{
  background:var(--navy);border-bottom:1px solid rgba(255,255,255,.09);
  padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;color:#efebe3;
}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .logo{width:30px;height:30px;flex:none}
.brand .name{font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--brand)}
.brand .prod{font-weight:500;font-size:13.5px;color:rgba(255,255,255,.6);letter-spacing:.2px}
header .sep{background:rgba(255,255,255,.15)}
header .tab{color:rgba(255,255,255,.66)}
header .tab:hover{background:rgba(255,255,255,.08);color:#fff}
header .tab.active{background:rgba(210,164,91,.18);color:var(--brand);font-weight:600}
header .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.17);color:#ede9e1;box-shadow:none}
header .btn:hover{background:rgba(210,164,91,.14);border-color:var(--brand);color:var(--brand)}
header .btn.ghost{background:transparent;border-color:transparent;color:rgba(255,255,255,.7)}
header .btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{
  background:transparent;border:1px solid transparent;padding:6px 12px;border-radius:99px;
  cursor:pointer;color:var(--muted);white-space:nowrap;
}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.sep{width:1px;height:22px;background:var(--border)}
.grow{flex:1 1 auto}

/* ---------- buttons ---------- */
.btn{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:6px 11px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#2a3040;font-weight:600}
.btn.primary:hover{filter:brightness(1.06);color:#2a3040}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text);border-color:var(--border)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.go:hover{filter:brightness(1.08);color:#fff}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.stop:hover{filter:brightness(1.08);color:#fff}

/* ---------- running bar ---------- */
#runbar{
  display:none;align-items:center;gap:12px;padding:8px 16px;
  background:var(--green-soft);border-bottom:1px solid var(--border);color:var(--text);
}
#runbar.on{display:flex}
#runbar .dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#runbar .what{font-weight:600}
#runbar .clock{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;letter-spacing:.5px}

/* ---------- layout ---------- */
main{flex:1 1 auto;overflow:auto;padding:16px;display:block}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card .body{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- project list ---------- */
.plist{max-height:calc(100vh - 220px);overflow:auto}
.pitem{
  padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;
  gap:8px;align-items:flex-start;
}
.pitem:hover{background:var(--panel-2)}
.pitem.active{background:var(--accent-soft)}
.pitem .nm{font-weight:600;flex:1;word-break:break-word}
.pitem .meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;white-space:nowrap;font-weight:600}
.s-ns{background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
.s-dev{background:var(--amber-soft);color:var(--amber)}
.s-done{background:var(--green-soft);color:var(--green)}
.s-rec{background:var(--purple-soft);color:var(--purple)}

/* task statuses */
.t-ns{background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
.t-prog{background:var(--info-soft);color:var(--info)}
.t-wait{background:var(--amber-soft);color:var(--amber)}
.t-rev{background:var(--purple-soft);color:var(--purple)}
.t-pause{background:var(--panel-2);color:var(--muted);border:1px dashed var(--border-strong,var(--muted))}
.t-done{background:var(--green-soft);color:var(--green)}
.t-cancel{background:var(--red-soft);color:var(--red)}

/* assignment + dates in the task table */
.who{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.who .me{color:var(--muted)}
.who .other{font-weight:600}
.dates{display:flex;flex-direction:column;gap:2px;font-size:12px;white-space:nowrap}
.dates span{color:var(--muted)}
.dates b{font-weight:600;color:var(--text)}
.closed{text-decoration:line-through;opacity:.55}

/* ---------- forms ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%;
  font-weight:400;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}

/* ---------- tasks ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.running{background:var(--green-soft)}
.ttitle{font-weight:600;word-break:break-word}
.type-pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.right{text-align:right}
.nowrap{white-space:nowrap}
.rowacts{display:flex;gap:5px;justify-content:flex-end}

/* ---------- milestones ---------- */
.ms{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.ms:last-child{border-bottom:none}
.ms .lbl{flex:1}
.ms.done .lbl{text-decoration:line-through;color:var(--muted)}
.due-over{color:var(--red);font-weight:600}
.due-soon{color:var(--amber);font-weight:600}

/* ---------- modal ---------- */
#modalRoot{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modalRoot.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:90vh;overflow:auto}
.modal .head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700}
.modal .body{padding:16px;display:grid;gap:12px}
.modal .foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted);margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--accent);min-width:2px}
.bartrack{background:var(--panel-2);border-radius:99px;overflow:hidden;width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.kpi.alarm{background:var(--red-soft);border-color:var(--red)}
.kpi.alarm .v{color:var(--red)}
tr.grp td{
  background:var(--panel-2);font-size:11.5px;text-transform:uppercase;
  letter-spacing:.4px;font-weight:700;padding:7px 10px;
}
tr.grp td .muted{font-weight:600}
tr.duerow{cursor:pointer}
tr.duerow:hover{background:var(--accent-soft)}
.entrylist{margin-top:8px;border-top:1px dashed var(--border)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Aphelion">
      <circle cx="29" cy="32" r="24" fill="none" stroke="var(--brand)" stroke-width="3.1"/>
      <circle cx="29" cy="32" r="19.4" fill="none" stroke="var(--brand)" stroke-width="1.3"/>
      <text x="29" y="32" text-anchor="middle" dominant-baseline="central"
            font-family="Georgia,'Times New Roman',serif" font-size="29" fill="var(--brand)">A</text>
      <circle cx="54" cy="41" r="9.6" fill="var(--navy)"/>
      <circle cx="55" cy="41" r="7.1" fill="var(--brand)"/>
    </svg>
    <span class="name">Aphelion</span>
    <span class="prod">Ledger</span>
  </div>
  <div class="sep"></div>
  <div class="tabs" id="containerTabs"></div>
  <button class="btn sm ghost" id="addContainerBtn" title="Add a new container">+ Container</button>
  <div class="grow"></div>
  <div class="tabs">
    <button class="tab" data-view="projects">Projects</button>
    <button class="tab" data-view="reports">Reports</button>
    <button class="tab" data-view="members">Members</button>
  </div>
  <div class="sep"></div>
  <span class="badge" id="storeChip" title="Whether this browser is allowed to save your data locally"></span>
  <button class="btn sm" id="exportBtn">Backup</button>
  <button class="btn sm" id="importBtn">Restore</button>
  <input type="file" id="importFile" accept="application/json,.json" style="display:none">
</header>

<div id="runbar">
  <div class="dot"></div>
  <div class="what" id="runWhat"></div>
  <div class="clock" id="runClock">0:00:00</div>
  <div class="grow"></div>
  <button class="btn sm stop" id="runStop">Stop</button>
</div>

<main id="view"></main>
<div id="modalRoot"></div>

<script>
"use strict";

/* =========================================================
   Constants
   ========================================================= */
// Deliberately unchanged across the rename: this key is where existing
// users' data already lives, and renaming it would orphan every install.
const STORAGE_KEY = "personalTimeTracker.v1";

const STATUSES = ["Not Started", "In Development", "Completed", "Recurring Maintenance"];
const STATUS_CLASS = {
  "Not Started": "s-ns",
  "In Development": "s-dev",
  "Completed": "s-done",
  "Recurring Maintenance": "s-rec"
};

const TASK_TYPES = [
  "Meeting / Call",
  "Development Work",
  "Presentation / E-mail Preparation",
  "Research & Analysis",
  "Documentation",
  "Review / QA / Testing",
  "Planning & Scoping",
  "Support & Troubleshooting",
  "Training & Learning",
  "Admin & Reporting",
  "Travel",
  "Other"
];

const TASK_STATUSES = [
  "Not Started",
  "In Progress",
  "Waiting on Other Person/Team",
  "In Review / Approval",
  "Paused",
  "Completed",
  "Cancelled"
];

const TASK_STATUS_CLASS = {
  "Not Started": "t-ns",
  "In Progress": "t-prog",
  "Waiting on Other Person/Team": "t-wait",
  "In Review / Approval": "t-rev",
  "Paused": "t-pause",
  "Completed": "t-done",
  "Cancelled": "t-cancel"
};

/* Statuses that take a task off your plate - used for "open" counts and styling. */
function isTaskClosed(t) {
  return t.status === "Completed" || t.status === "Cancelled";
}

const SELF = "Myself";
const NEW_MEMBER = "__new__";

/* ---------- members ----------
   Each container keeps its own list of people, because containers hold
   separate worlds: your work colleagues have no business in Personal. */

function containerMembers(c) {
  return (c && Array.isArray(c.members)) ? c.members : [];
}
function findMember(c, id) {
  return containerMembers(c).find(function (m) { return m.id === id; }) || null;
}
function selfMember(c) {
  const list = containerMembers(c);
  return list.find(function (m) { return m.self; }) || list[0] || null;
}
function memberName(c, id) {
  const m = findMember(c, id);
  return m ? m.name : "Unassigned";
}
/** Options for an assignment dropdown: every member, then "add someone new". */
function memberOptions(c) {
  const opts = containerMembers(c).map(function (m) {
    return { value: m.id, label: m.team ? m.name + " — " + m.team : m.name };
  });
  opts.push({ value: NEW_MEMBER, label: "+ Add someone new…" });
  return opts;
}
/** How many tasks in this container point at a given member. */
function memberTaskCount(c, id) {
  let n = 0;
  c.projects.forEach(function (p) {
    p.tasks.forEach(function (t) { if (t.assigneeId === id) n++; });
  });
  return n;
}

/** Shared validation for the new-task and edit-task forms. */
function validateTaskDates(v) {
  if (!v.title.trim()) return "Task name is required.";
  if (v.started && v.due && v.due < v.started) {
    return "The due date is before the start date. Swap them, or clear one.";
  }
  return null;
}

/* =========================================================
   State
   ========================================================= */
let state = null;
let tickHandle = null;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function defaultState() {
  return {
    version: 1,
    containers: [
      { id: uid(), name: "Work", projects: [] },
      { id: uid(), name: "Personal", projects: [] }
    ],
    running: null, // {containerId, projectId, taskId, startedAt}
    ui: { containerId: null, projectId: null, view: "projects", range: "all" }
  };
}

function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    raw = null;
  }
  if (!raw) {
    state = defaultState();
    state.ui.containerId = state.containers[0].id;
    normalise();   // a fresh install still needs its member lists seeding
    save();
    return;
  }
  try {
    state = JSON.parse(raw);
  } catch (e) {
    state = defaultState();
  }
  normalise();
}

function normalise() {
  if (!state || typeof state !== "object") state = defaultState();
  if (!Array.isArray(state.containers) || !state.containers.length) {
    state.containers = defaultState().containers;
  }
  state.ui = state.ui || {};
  state.ui.view = ["reports", "members"].indexOf(state.ui.view) >= 0 ? state.ui.view : "projects";
  state.ui.range = state.ui.range || "all";
  state.containers.forEach(function (c) {
    c.id = c.id || uid();
    c.name = c.name || "Untitled";
    c.projects = Array.isArray(c.projects) ? c.projects : [];

    // Every container has a member list, and it always starts with you.
    c.members = Array.isArray(c.members) ? c.members : [];
    c.members.forEach(function (m) {
      m.id = m.id || uid();
      m.name = (m.name || "").trim() || "Unnamed";
      m.team = m.team || "";
      m.email = m.email || "";
      m.self = !!m.self;
    });
    if (!c.members.some(function (m) { return m.self; })) {
      c.members.unshift({ id: uid(), name: SELF, team: "", email: "", self: true });
    }
    const me = selfMember(c);
    c.projects.forEach(function (p) {
      p.id = p.id || uid();
      p.name = p.name || "Untitled project";
      p.description = p.description || "";
      p.person = p.person || "";
      p.department = p.department || "";
      p.status = STATUSES.indexOf(p.status) >= 0 ? p.status : STATUSES[0];
      p.milestones = Array.isArray(p.milestones) ? p.milestones : [];
      p.tasks = Array.isArray(p.tasks) ? p.tasks : [];
      p.milestones.forEach(function (m) {
        m.id = m.id || uid();
        m.label = m.label || "";
        m.due = m.due || "";
        m.done = !!m.done;
      });
      p.tasks.forEach(function (t) {
        t.id = t.id || uid();
        t.title = t.title || "Untitled task";
        t.type = TASK_TYPES.indexOf(t.type) >= 0 ? t.type : "Other";
        t.notes = t.notes || "";
        // v1.0 tasks carried a done flag; it becomes a status.
        t.status = TASK_STATUSES.indexOf(t.status) >= 0
          ? t.status
          : (t.done ? "Completed" : "Not Started");
        delete t.done;
        // Free-text assignees become real member records, matched by name.
        if (!t.assigneeId || !findMember(c, t.assigneeId)) {
          const written = (typeof t.assignee === "string") ? t.assignee.trim() : "";
          if (!written || written === SELF) {
            t.assigneeId = me.id;
          } else {
            const hit = c.members.find(function (m) {
              return m.name.toLowerCase() === written.toLowerCase();
            });
            if (hit) {
              t.assigneeId = hit.id;
            } else {
              const added = { id: uid(), name: written, team: "", email: "", self: false };
              c.members.push(added);
              t.assigneeId = added.id;
            }
          }
        }
        delete t.assignee;
        t.started = t.started || "";
        t.due = t.due || "";
        t.entries = Array.isArray(t.entries) ? t.entries : [];
        t.entries.forEach(function (e) {
          e.id = e.id || uid();
          e.start = Number(e.start) || 0;
          e.end = Number(e.end) || 0;
        });
      });
    });
  });
  if (!findContainer(state.ui.containerId)) state.ui.containerId = state.containers[0].id;
  if (state.running && !findTask(state.running)) state.running = null;
}

let saveWarned = false;
let storageOK = true;

function setStorageChip(ok) {
  storageOK = ok;
  const chip = document.getElementById("storeChip");
  if (!chip) return;
  chip.className = "badge " + (ok ? "s-done" : "s-ns");
  chip.textContent = ok ? "✓ Saved" : "⚠ Not saving";
  if (!ok) {
    chip.style.background = "var(--red-soft)";
    chip.style.color = "var(--red)";
    chip.style.borderColor = "transparent";
    chip.title = "This browser is blocking local storage. Your data will be lost on reload — use Backup.";
  } else {
    chip.style.background = "";
    chip.style.color = "";
    chip.title = "Your data is saved in this browser automatically.";
  }
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (!storageOK) setStorageChip(true);
  } catch (e) {
    setStorageChip(false);
    if (!saveWarned) {
      saveWarned = true;
      alert(
        "This browser refused to save data locally (storage blocked or full).\n\n" +
        "Your work is still on screen, but it will NOT survive a reload.\n" +
        "Use the Backup button to save a .json file, then Restore it later."
      );
    }
  }
}

/* =========================================================
   Lookups
   ========================================================= */
function findContainer(id) {
  return state.containers.find(function (c) { return c.id === id; }) || null;
}
function activeContainer() {
  return findContainer(state.ui.containerId);
}
function findProject(containerId, projectId) {
  const c = findContainer(containerId);
  if (!c) return null;
  return c.projects.find(function (p) { return p.id === projectId; }) || null;
}
function activeProject() {
  return findProject(state.ui.containerId, state.ui.projectId);
}
function findTask(ref) {
  const p = findProject(ref.containerId, ref.projectId);
  if (!p) return null;
  return p.tasks.find(function (t) { return t.id === ref.taskId; }) || null;
}

/* =========================================================
   Time helpers
   ========================================================= */
function now() { return Date.now(); }

function taskLoggedMs(task) {
  return task.entries.reduce(function (sum, e) {
    return sum + Math.max(0, (e.end || 0) - (e.start || 0));
  }, 0);
}
function isRunningTask(task) {
  return !!(state.running && state.running.taskId === task.id);
}
function taskTotalMs(task) {
  let ms = taskLoggedMs(task);
  if (isRunningTask(task)) ms += Math.max(0, now() - state.running.startedAt);
  return ms;
}
function projectTotalMs(project) {
  return project.tasks.reduce(function (s, t) { return s + taskTotalMs(t); }, 0);
}

function fmtClock(ms) {
  const total = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function fmtDur(ms) {
  const total = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  if (h === 0 && m === 0) return total + "s";
  if (h === 0) return m + "m";
  return h + "h " + String(m).padStart(2, "0") + "m";
}
function fmtHours(ms) {
  return (ms / 3600000).toFixed(2);
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* =========================================================
   Timer control
   ========================================================= */
function startTimer(containerId, projectId, taskId) {
  if (state.running) stopTimer(true);
  state.running = { containerId: containerId, projectId: projectId, taskId: taskId, startedAt: now() };
  // Working on something is the moment it started, so fill these in - but only
  // when they are still untouched, never overriding what you set by hand.
  const t = findTask(state.running);
  if (t) {
    if (!t.started) t.started = todayISO();
    if (t.status === "Not Started") t.status = "In Progress";
  }
  save();
  render();
}

function stopTimer(skipRender) {
  if (!state.running) return;
  const task = findTask(state.running);
  const started = state.running.startedAt;
  const ended = now();
  state.running = null;
  if (task && ended - started >= 1000) {
    task.entries.push({ id: uid(), start: started, end: ended });
  }
  save();
  if (!skipRender) render();
}

function tick() {
  if (!state.running) return;
  const elapsed = now() - state.running.startedAt;
  const clock = document.getElementById("runClock");
  if (clock) clock.textContent = fmtClock(elapsed);
  document.querySelectorAll("[data-live-task]").forEach(function (el) {
    const t = findTask({
      containerId: state.running.containerId,
      projectId: state.running.projectId,
      taskId: el.getAttribute("data-live-task")
    });
    if (t && el.getAttribute("data-live-task") === state.running.taskId) {
      el.textContent = fmtClock(taskTotalMs(t));
    }
  });
  document.querySelectorAll("[data-live-project]").forEach(function (el) {
    const p = findProject(state.running.containerId, el.getAttribute("data-live-project"));
    if (p) el.textContent = fmtDur(projectTotalMs(p));
  });
}

/* =========================================================
   Modal
   ========================================================= */
function openModal(opts) {
  const root = document.getElementById("modalRoot");
  const fields = opts.fields || [];
  let html = '<div class="modal"><div class="head">' + esc(opts.title) + "</div><div class=\"body\">";
  if (opts.intro) html += '<div class="hint">' + esc(opts.intro) + "</div>";
  fields.forEach(function (f, i) {
    html += '<label class="f">' + esc(f.label);
    const id = "mf_" + i;
    if (f.type === "textarea") {
      html += '<textarea id="' + id + '">' + esc(f.value || "") + "</textarea>";
    } else if (f.type === "select") {
      html += '<select id="' + id + '">';
      // Options are plain strings, or {value,label} when the label differs.
      (f.options || []).forEach(function (o) {
        const val = (o && typeof o === "object") ? o.value : o;
        const lab = (o && typeof o === "object") ? o.label : o;
        html += '<option value="' + esc(val) + '"' + (val === f.value ? " selected" : "") + ">" + esc(lab) + "</option>";
      });
      html += "</select>";
    } else if (f.type === "combo") {
      // Free text, with previously used values offered as suggestions.
      html += '<input type="text" id="' + id + '" list="' + id + '_list" value="' + esc(f.value || "") +
        '" placeholder="' + esc(f.placeholder || "") + '">' +
        '<datalist id="' + id + '_list">' +
        (f.options || []).map(function (o) { return '<option value="' + esc(o) + '"></option>'; }).join("") +
        "</datalist>";
    } else if (f.type === "date") {
      html += '<input type="date" id="' + id + '" value="' + esc(f.value || "") + '">';
    } else if (f.type === "number") {
      html += '<input type="number" id="' + id + '" value="' + esc(f.value == null ? "" : f.value) + '"' +
        (f.min != null ? ' min="' + f.min + '"' : "") + (f.step ? ' step="' + f.step + '"' : "") + ">";
    } else {
      html += '<input type="text" id="' + id + '" value="' + esc(f.value || "") + '" placeholder="' + esc(f.placeholder || "") + '">';
    }
    html += "</label>";
  });
  html += '</div><div class="foot">' +
    '<button class="btn" id="mCancel">Cancel</button>' +
    '<button class="btn primary" id="mOk">' + esc(opts.okLabel || "Save") + "</button>" +
    "</div></div>";
  root.innerHTML = html;
  root.classList.add("on");

  const first = root.querySelector("input,select,textarea");
  if (first) { first.focus(); if (first.select) first.select(); }

  function close() {
    root.classList.remove("on");
    root.innerHTML = "";
    document.removeEventListener("keydown", onKey);
  }
  function submit() {
    const values = {};
    fields.forEach(function (f, i) {
      const el = document.getElementById("mf_" + i);
      values[f.key] = el ? el.value : "";
    });
    if (opts.validate) {
      const err = opts.validate(values);
      if (err) { alert(err); return; }
    }
    close();
    opts.onSubmit(values);
  }
  function onKey(e) {
    if (e.key === "Escape") close();
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); submit(); }
  }
  document.getElementById("mCancel").onclick = close;
  document.getElementById("mOk").onclick = submit;
  root.onclick = function (e) { if (e.target === root) close(); };
  document.addEventListener("keydown", onKey);
}

/* =========================================================
   Render: shell
   ========================================================= */
function render() {
  renderContainerTabs();
  renderRunBar();
  document.querySelectorAll("header .tab[data-view]").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-view") === state.ui.view);
  });
  const view = document.getElementById("view");
  if (state.ui.view === "reports") {
    view.innerHTML = reportsHTML();
    wireReports();
  } else if (state.ui.view === "members") {
    view.innerHTML = membersHTML();
    wireMembers();
  } else {
    view.innerHTML = projectsHTML();
    wireProjects();
  }
}

function renderContainerTabs() {
  const wrap = document.getElementById("containerTabs");
  wrap.innerHTML = state.containers.map(function (c) {
    return '<button class="tab' + (c.id === state.ui.containerId ? " active" : "") +
      '" data-container="' + c.id + '">' + esc(c.name) + "</button>";
  }).join("");
  wrap.querySelectorAll("[data-container]").forEach(function (b) {
    b.onclick = function () {
      const id = b.getAttribute("data-container");
      if (id === state.ui.containerId) { containerMenu(id); return; }
      state.ui.containerId = id;
      state.ui.projectId = null;
      save();
      render();
    };
  });
}

function containerMenu(id) {
  const c = findContainer(id);
  if (!c) return;
  openModal({
    title: "Container settings",
    intro: "Rename this container, or remove it entirely.",
    fields: [{ key: "name", label: "Container name", value: c.name }],
    okLabel: "Rename",
    validate: function (v) { return v.name.trim() ? null : "Name cannot be empty."; },
    onSubmit: function (v) {
      c.name = v.name.trim();
      save();
      render();
    }
  });
  const foot = document.querySelector("#modalRoot .foot");
  if (foot && state.containers.length > 1) {
    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "Delete container";
    del.style.marginRight = "auto";
    del.onclick = function () {
      const n = c.projects.length;
      if (!confirm('Delete container "' + c.name + '" and its ' + n + " project(s), including all logged time?")) return;
      if (state.running && state.running.containerId === c.id) state.running = null;
      state.containers = state.containers.filter(function (x) { return x.id !== c.id; });
      state.ui.containerId = state.containers[0].id;
      state.ui.projectId = null;
      save();
      document.getElementById("modalRoot").classList.remove("on");
      document.getElementById("modalRoot").innerHTML = "";
      render();
    };
    foot.insertBefore(del, foot.firstChild);
  }
}

function renderRunBar() {
  const bar = document.getElementById("runbar");
  if (!state.running) { bar.classList.remove("on"); return; }
  const t = findTask(state.running);
  const p = findProject(state.running.containerId, state.running.projectId);
  const c = findContainer(state.running.containerId);
  if (!t || !p) { state.running = null; bar.classList.remove("on"); return; }
  bar.classList.add("on");
  document.getElementById("runWhat").textContent =
    t.title + "  ·  " + p.name + (c ? "  ·  " + c.name : "");
  document.getElementById("runClock").textContent = fmtClock(now() - state.running.startedAt);
}

/* =========================================================
   Render: projects view
   ========================================================= */
function projectsHTML() {
  const c = activeContainer();
  const projects = c ? c.projects : [];
  const p = activeProject();

  let list = "";
  if (!projects.length) {
    list = '<div class="empty">No projects in <b>' + esc(c ? c.name : "") + "</b> yet.<br><br>" +
      '<button class="btn primary" data-act="newProject">+ New project</button></div>';
  } else {
    list = '<div class="plist">' + projects.map(function (pr) {
      return '<div class="pitem' + (p && pr.id === p.id ? " active" : "") + '" data-open="' + pr.id + '">' +
        '<div style="flex:1">' +
          '<div class="nm">' + esc(pr.name) + "</div>" +
          '<div class="meta">' +
            '<span class="badge ' + STATUS_CLASS[pr.status] + '">' + esc(pr.status) + "</span>" +
            '<span class="small muted mono" data-live-project="' + pr.id + '">' + fmtDur(projectTotalMs(pr)) + "</span>" +
            '<span class="small muted">' + pr.tasks.length + " task" + (pr.tasks.length === 1 ? "" : "s") + "</span>" +
          "</div>" +
        "</div></div>";
    }).join("") + "</div>";
  }

  const sidebar =
    '<div class="card">' +
      '<div class="head"><h3 style="flex:1">Projects</h3>' +
        '<button class="btn sm primary" data-act="newProject">+ New</button></div>' +
      list +
    "</div>";

  return '<div class="wrap">' + sidebar + '<div>' + (p ? projectDetailHTML(p) : emptyDetailHTML()) + "</div></div>";
}

function emptyDetailHTML() {
  return '<div class="card"><div class="empty">' +
    "Select a project on the left, or create one to get started.<br><br>" +
    '<span class="hint">Tip: every task has its own start/stop timer, and totals roll up per project.</span>' +
    "</div></div>";
}

function projectDetailHTML(p) {
  const total = projectTotalMs(p);
  const openTasks = p.tasks.filter(function (t) { return !isTaskClosed(t); }).length;

  /* --- details card --- */
  let html =
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="head">' +
        '<h2 style="flex:1">' + esc(p.name) + "</h2>" +
        '<span class="badge ' + STATUS_CLASS[p.status] + '">' + esc(p.status) + "</span>" +
        '<button class="btn sm ghost" data-act="renameProject">Rename</button>' +
        '<button class="btn sm ghost danger" data-act="deleteProject">Delete</button>' +
      "</div>" +
      '<div class="body">' +
        '<div class="kpis" style="margin-bottom:14px">' +
          '<div class="kpi"><div class="v mono" data-live-project="' + p.id + '">' + fmtDur(total) + "</div><div class=\"k\">Total tracked</div></div>" +
          '<div class="kpi"><div class="v mono">' + fmtHours(total) + '</div><div class="k">Hours (decimal)</div></div>' +
          '<div class="kpi"><div class="v mono">' + p.tasks.length + '</div><div class="k">Tasks (' + openTasks + " open)</div></div>" +
          '<div class="kpi"><div class="v mono">' + p.milestones.filter(function (m) { return !m.done; }).length +
            '</div><div class="k">Open milestones</div></div>' +
        "</div>" +
        '<div class="fields">' +
          '<label class="f">Person / requester<input type="text" data-field="person" value="' + esc(p.person) + '" placeholder="e.g. Jane Doe"></label>' +
          '<label class="f">Department<input type="text" data-field="department" value="' + esc(p.department) + '" placeholder="e.g. Finance"></label>' +
          '<label class="f">Status<select data-field="status">' +
            STATUSES.map(function (s) {
              return '<option value="' + esc(s) + '"' + (s === p.status ? " selected" : "") + ">" + esc(s) + "</option>";
            }).join("") +
          "</select></label>" +
        "</div>" +
        '<label class="f" style="margin-top:12px">Description' +
          '<textarea data-field="description" placeholder="What is this project about?">' + esc(p.description) + "</textarea></label>" +
        '<div class="hint" style="margin-top:6px">Changes to these fields save when you click away.</div>' +
      "</div>" +
    "</div>";

  /* --- milestones --- */
  html +=
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="head"><h3 style="flex:1">Milestones</h3>' +
        '<button class="btn sm" data-act="newMilestone">+ Milestone</button></div>' +
      '<div class="body">' +
        (p.milestones.length
          ? p.milestones.slice().sort(milestoneSort).map(milestoneHTML).join("")
          : '<div class="hint">No milestones yet.</div>') +
      "</div>" +
    "</div>";

  /* --- tasks --- */
  html +=
    '<div class="card">' +
      '<div class="head"><h3 style="flex:1">Tasks</h3>' +
        '<button class="btn sm primary" data-act="newTask">+ Task</button></div>';

  if (!p.tasks.length) {
    html += '<div class="empty">No tasks yet. Add one, then hit <b>Start</b> to track time against it.</div>';
  } else {
    html += '<div style="overflow:auto"><table><thead><tr>' +
      "<th>Task</th><th>Type</th><th>Status</th><th>Assigned to</th><th>Dates</th>" +
      "<th class=\"right\">Time</th><th class=\"right\">Actions</th>" +
      "</tr></thead><tbody>" +
      p.tasks.map(function (t) { return taskRowHTML(p, t); }).join("") +
      "</tbody></table></div>";
  }
  html += "</div>";
  return html;
}

function milestoneSort(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (!a.due) return 1;
  if (!b.due) return -1;
  return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
}

function milestoneHTML(m) {
  let dueCls = "";
  let dueTxt = m.due ? new Date(m.due + "T00:00:00").toLocaleDateString() : "no due date";
  if (m.due && !m.done) {
    const days = Math.ceil((new Date(m.due + "T23:59:59") - now()) / 86400000);
    if (days < 0) { dueCls = "due-over"; dueTxt += " (overdue)"; }
    else if (days <= 7) { dueCls = "due-soon"; dueTxt += days === 0 ? " (today)" : " (in " + days + "d)"; }
  }
  return '<div class="ms' + (m.done ? " done" : "") + '">' +
    '<input type="checkbox" data-ms-toggle="' + m.id + '"' + (m.done ? " checked" : "") + ">" +
    '<div class="lbl">' + esc(m.label) + "</div>" +
    '<div class="small ' + dueCls + '">' + esc(dueTxt) + "</div>" +
    '<button class="btn sm ghost" data-ms-edit="' + m.id + '">Edit</button>' +
    '<button class="btn sm ghost danger" data-ms-del="' + m.id + '">&times;</button>' +
    "</div>";
}

/** Short "12 Aug" style date, with overdue/soon flagging for live tasks. */
function dueInfo(dateStr, closed) {
  if (!dateStr) return { text: "—", cls: "" };
  const d = new Date(dateStr + "T00:00:00");
  const text = d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  if (closed) return { text: text, cls: "" };
  const days = Math.ceil((new Date(dateStr + "T23:59:59") - now()) / 86400000);
  if (days < 0) return { text: text + " · overdue", cls: "due-over" };
  if (days === 0) return { text: text + " · today", cls: "due-soon" };
  if (days <= 7) return { text: text + " · " + days + "d", cls: "due-soon" };
  return { text: text, cls: "" };
}

function taskRowHTML(p, t) {
  const running = isRunningTask(t);
  const closed = isTaskClosed(t);
  const entries = t.entries.slice().sort(function (a, b) { return b.start - a.start; });
  const due = dueInfo(t.due, closed);
  const startedTxt = t.started
    ? new Date(t.started + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })
    : "—";
  const c = activeContainer();
  const member = findMember(c, t.assigneeId);
  const mine = !!(member && member.self);
  let row =
    '<tr class="' + (running ? "running" : "") + '">' +
      '<td><div class="ttitle' + (closed ? " closed" : "") + '">' + esc(t.title) + "</div>" +
        (t.notes ? '<div class="small muted">' + esc(t.notes) + "</div>" : "") +
        '<div class="small muted">' + entries.length + " session" + (entries.length === 1 ? "" : "s") +
          (entries.length ? ' · <a href="#" data-entries="' + t.id + '">details</a>' : "") + "</div></td>" +
      '<td><span class="type-pill">' + esc(t.type) + "</span></td>" +
      '<td><span class="badge ' + TASK_STATUS_CLASS[t.status] + '">' + esc(t.status) + "</span></td>" +
      '<td><span class="who">' + (mine
        ? '<span class="me">' + esc(member.name) + "</span>"
        : '<span class="other">' + esc(member ? member.name : "Unassigned") + "</span>") + "</span>" +
        (member && member.team && !mine ? '<div class="small muted">' + esc(member.team) + "</div>" : "") + "</td>" +
      '<td><div class="dates">' +
        "<div><span>Started</span> <b>" + esc(startedTxt) + "</b></div>" +
        '<div><span>Due</span> <b class="' + due.cls + '">' + esc(due.text) + "</b></div>" +
      "</div></td>" +
      '<td class="right mono nowrap" data-live-task="' + t.id + '">' + fmtClock(taskTotalMs(t)) + "</td>" +
      '<td><div class="rowacts">' +
        (running
          ? '<button class="btn sm stop" data-stop="' + t.id + '">Stop</button>'
          : '<button class="btn sm go" data-start="' + t.id + '">Start</button>') +
        '<button class="btn sm ghost" data-add-time="' + t.id + '" title="Add time manually">+ Time</button>' +
        '<button class="btn sm ghost" data-edit-task="' + t.id + '">Edit</button>' +
        '<button class="btn sm ghost danger" data-del-task="' + t.id + '">&times;</button>' +
      "</div></td>" +
    "</tr>";

  if (state.ui.openEntries === t.id) {
    row += '<tr><td colspan="7" style="background:var(--panel-2)">' +
      '<div class="small muted" style="margin-bottom:6px"><b>Logged sessions</b> — delete any that were left running by mistake.</div>' +
      (entries.length
        ? entries.map(function (e) {
            return '<div class="ms"><div class="lbl small mono">' + esc(fmtDateTime(e.start)) + " &rarr; " +
              esc(new Date(e.end).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })) + "</div>" +
              '<div class="small mono">' + fmtDur(e.end - e.start) + "</div>" +
              '<button class="btn sm ghost danger" data-del-entry="' + t.id + "|" + e.id + '">&times;</button></div>';
          }).join("")
        : '<div class="hint">No sessions logged.</div>') +
      "</td></tr>";
  }
  return row;
}

/* =========================================================
   Wiring: projects view
   ========================================================= */
function wireProjects() {
  const view = document.getElementById("view");
  const c = activeContainer();

  view.querySelectorAll("[data-open]").forEach(function (el) {
    el.onclick = function () {
      state.ui.projectId = el.getAttribute("data-open");
      state.ui.openEntries = null;
      save();
      render();
    };
  });

  view.querySelectorAll('[data-act="newProject"]').forEach(function (b) {
    b.onclick = function () {
      openModal({
        title: "New project in " + c.name,
        fields: [
          { key: "name", label: "Project name", value: "", placeholder: "e.g. Q3 Budget Automation" },
          { key: "person", label: "Person / requester", value: "" },
          { key: "department", label: "Department", value: "" },
          { key: "status", label: "Status", type: "select", options: STATUSES, value: STATUSES[0] },
          { key: "description", label: "Description", type: "textarea", value: "" }
        ],
        okLabel: "Create project",
        validate: function (v) { return v.name.trim() ? null : "Project name is required."; },
        onSubmit: function (v) {
          const pr = {
            id: uid(), name: v.name.trim(), person: v.person.trim(), department: v.department.trim(),
            status: v.status, description: v.description, milestones: [], tasks: []
          };
          c.projects.push(pr);
          state.ui.projectId = pr.id;
          save();
          render();
        }
      });
    };
  });

  const p = activeProject();
  if (!p) return;

  view.querySelectorAll("[data-field]").forEach(function (el) {
    el.onchange = function () {
      p[el.getAttribute("data-field")] = el.value;

const RANGES = {
  all: "All time",
  today: "Today",
  week: "This week",
  month: "This month",
  last7: "Last 7 days",
  last30: "Last 30 days"
};

function rangeBounds(key) {
  const d = new Date();
  const startOfDay = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  switch (key) {
    case "today": return [startOfDay, Infinity];
    case "week": {
      const dow = (d.getDay() + 6) % 7; // Monday = 0
      return [startOfDay - dow * 86400000, Infinity];
    }
    case "month": return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), Infinity];
    case "last7": return [startOfDay - 6 * 86400000, Infinity];
    case "last30": return [startOfDay - 29 * 86400000, Infinity];
    default: return [-Infinity, Infinity];
  }
}

/** Add or edit a person. onDone receives the member, for chained flows. */
function openMemberModal(c, existing, onDone) {
  openModal({
    title: existing ? "Edit member" : "New member",
    intro: existing ? null : "Only a name is required.",
    fields: [
      { key: "name", label: "Name", value: existing ? existing.name : "", placeholder: "e.g. Mark Reilly" },
      { key: "team", label: "Team (optional)", value: existing ? existing.team : "", placeholder: "e.g. Infrastructure" },
      { key: "email", label: "E-mail (optional)", value: existing ? existing.email : "" }
    ],
    okLabel: existing ? "Save" : "Add member",
    validate: function (v) {
      const name = v.name.trim();
      if (!name) return "Name is required.";
      const clash = containerMembers(c).some(function (m) {
        return m !== existing && m.name.toLowerCase() === name.toLowerCase();
      });
      if (clash) return "There is already a member called " + name + " in this container.";
      return null;
    },
    onSubmit: function (v) {
      let m = existing;
      if (m) {
        m.name = v.name.trim(); m.team = v.team.trim(); m.email = v.email.trim();
      } else {
        m = { id: uid(), name: v.name.trim(), team: v.team.trim(), email: v.email.trim(), self: false };
        c.members.push(m);
      }
      save();
      if (onDone) onDone(m); else render();
    }
  });
}

/* ---------- upcoming work ---------- */

function startOfToday() {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
}

/**
 * Open tasks in the active container that carry a due date, split into
 * mutually exclusive horizons so nothing is listed twice. Weeks end on Sunday,
 * matching the "This week" time range.
 */
function dueBuckets() {
  const c = activeContainer();
  const DAY = 86400000;
  const today = startOfToday();
  const endOfToday = today + DAY - 1;
  const dow = (new Date().getDay() + 6) % 7;            // Monday = 0
  const endOfWeek = today + (6 - dow) * DAY + DAY - 1;  // Sunday, last moment
  const end14 = today + 13 * DAY + DAY - 1;             // today + 13 more days

  const items = [];
  if (c) {
    c.projects.forEach(function (p) {
      p.tasks.forEach(function (t) {
        if (!t.due || isTaskClosed(t)) return;
        items.push({ project: p, task: t, due: new Date(t.due + "T23:59:59").getTime() });
      });
    });
  }
  items.sort(function (a, b) { return a.due - b.due; });

  return {
    overdue: items.filter(function (i) { return i.due < today; }),
    today: items.filter(function (i) { return i.due >= today && i.due <= endOfToday; }),
    week: items.filter(function (i) { return i.due > endOfToday && i.due <= endOfWeek; }),
    later: items.filter(function (i) { return i.due > endOfWeek && i.due <= end14; })
  };
}

function dueDayLabel(item) {
  const d = new Date(item.task.due + "T00:00:00");
  const date = d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  // Whole calendar days between today and the due date, so wording never
  // drifts with the time of day.
  const diff = Math.round((d.getTime() - startOfToday()) / 86400000);
  if (diff < 0) {
    const late = -diff;
    return { date: date, rel: late + (late === 1 ? " day" : " days") + " late", cls: "due-over" };
  }
  if (diff === 0) return { date: date, rel: "today", cls: "due-soon" };
  if (diff === 1) return { date: date, rel: "tomorrow", cls: "due-soon" };
  return { date: date, rel: "in " + diff + " days", cls: "" };
}

/** All entries in the active container, clipped to the selected range. */
function collectRows() {
  const c = activeContainer();
  const bounds = rangeBounds(state.ui.range);
  const rows = [];
  if (!c) return rows;
  c.projects.forEach(function (p) {
    p.tasks.forEach(function (t) {
      const entries = t.entries.slice();
      if (isRunningTask(t)) entries.push({ id: "live", start: state.running.startedAt, end: now() });
      entries.forEach(function (e) {
        const s = Math.max(e.start, bounds[0]);
        const en = Math.min(e.end, bounds[1]);
        if (en > s) rows.push({ project: p, task: t, start: s, end: en, ms: en - s });
      });
    });
  });
  return rows;
}

function groupSum(rows, keyFn) {
  const map = new Map();
  rows.forEach(function (r) {
    const k = keyFn(r);
    map.set(k, (map.get(k) || 0) + r.ms);
  });
  return Array.from(map.entries()).sort(function (a, b) { return b[1] - a[1]; });
}

function barTableHTML(pairs, total) {
  if (!pairs.length) return '<div class="hint">Nothing logged in this period.</div>';
  return '<table><tbody>' + pairs.map(function (pair) {
    const pct = total ? (pair[1] / total) * 100 : 0;
    return "<tr><td style=\"width:38%\">" + esc(pair[0]) + "</td>" +
      '<td><div class="bartrack"><div class="bar" style="width:' + pct.toFixed(1) + '%"></div></div></td>' +
      '<td class="right mono nowrap" style="width:110px">' + fmtDur(pair[1]) + "</td>" +
      '<td class="right mono muted nowrap" style="width:60px">' + pct.toFixed(0) + "%</td></tr>";
  }).join("") + "</tbody></table>";
}

  html += '<div class="card" style="margin-top:16px"><div class="head"><h3>By department</h3></div><div class="body">' +
    barTableHTML(groupSum(rows, function (r) { return r.project.department || "(unassigned)"; }), total) + "</div></div>";

  /* task breakdown */
  const byTask = new Map();
  rows.forEach(function (r) {
    const k = r.project.id + "|" + r.task.id;
    if (!byTask.has(k)) byTask.set(k, { project: r.project, task: r.task, ms: 0 });
    byTask.get(k).ms += r.ms;
  });
  const taskRows = Array.from(byTask.values()).sort(function (a, b) { return b.ms - a.ms; });

  html += '<div class="card" style="margin-top:16px"><div class="head"><h3>Task detail</h3></div>';
  if (!taskRows.length) {
    html += '<div class="empty">No time logged in this period.</div>';
  } else {
    html += '<div style="overflow:auto"><table><thead><tr><th>Project</th><th>Task</th><th>Type</th><th>Person</th>' +
      '<th>Department</th><th class="right">Time</th><th class="right">Hours</th></tr></thead><tbody>' +
      taskRows.map(function (r) {
        return "<tr><td>" + esc(r.project.name) + "</td><td>" + esc(r.task.title) + "</td>" +
          '<td><span class="type-pill">' + esc(r.task.type) + "</span></td>" +
          "<td>" + esc(r.project.person || "—") + "</td><td>" + esc(r.project.department || "—") + "</td>" +
          '<td class="right mono nowrap">' + fmtDur(r.ms) + '</td><td class="right mono">' + fmtHours(r.ms) + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  html += "</div></div>";
  return html;
}

function wireReports() {
  document.querySelectorAll("#view [data-goto]").forEach(function (row) {
    row.onclick = function () {
      state.ui.projectId = row.getAttribute("data-goto");
      state.ui.view = "projects";
      state.ui.openEntries = null;
      save();
      render();
      window.scrollTo(0, 0);
    };
  });
  const sel = document.getElementById("rangeSel");
  if (sel) sel.onchange = function () { state.ui.range = sel.value; save(); render(); };
  const csv = document.getElementById("csvBtn");
  if (csv) csv.onclick = exportCSV;
}

/* =========================================================
   Import / export
   ========================================================= */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function stamp() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
    "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0");
}

function exportJSON() {
  download("aphelion-ledger-backup-" + stamp() + ".json", JSON.stringify(state, null, 2), "application/json");
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const c = activeContainer();
  const rows = collectRows();
  const header = ["Container", "Project", "Project Status", "Person", "Department", "Task", "Type",
    "Task Status", "Assigned To", "Date Started", "Due Date", "Start", "End", "Duration", "Hours"];
  const lines = [header.map(csvCell).join(",")];
  rows.sort(function (a, b) { return a.start - b.start; }).forEach(function (r) {
    lines.push([
      c.name, r.project.name, r.project.status, r.project.person, r.project.department,
      r.task.title, r.task.type, r.task.status, memberName(c, r.task.assigneeId), r.task.started, r.task.due,
      fmtDateTime(r.start), fmtDateTime(r.end), fmtDur(r.ms), fmtHours(r.ms)
    ].map(csvCell).join(","));
  });
  const total = rows.reduce(function (s, r) { return s + r.ms; }, 0);
  lines.push(["", "", "", "", "", "", "", "", "", "", "", "", "TOTAL", fmtDur(total), fmtHours(total)].map(csvCell).join(","));
  download("aphelion-ledger-report-" + c.name.replace(/[^\w-]+/g, "_") + "-" + stamp() + ".csv", lines.join("\r\n"), "text/csv;charset=utf-8");
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = function () {
    let data;
    try {
      data = JSON.parse(String(reader.result));
    } catch (e) {
      alert("That file is not a valid Aphelion Ledger backup.");
      return;
    }
    if (!data || !Array.isArray(data.containers)) {
      alert("That file does not look like an Aphelion Ledger backup.");
      return;
    }
    if (!confirm("Restoring replaces everything currently in this app. Continue?")) return;
    state = data;
    normalise();
    save();
    render();
    alert("Backup restored.");
  };
  reader.readAsText(file);
}

/* =========================================================
   Boot
   ========================================================= */
function boot() {
  load();

  // Probe local storage so the header can tell the user, up front, whether
  // this machine will actually keep their data between sessions.
  try {
    localStorage.setItem(STORAGE_KEY + ".probe", "1");
    localStorage.removeItem(STORAGE_KEY + ".probe");
    setStorageChip(true);
  } catch (e) {
    setStorageChip(false);
  }

  document.querySelectorAll("header .tab[data-view]").forEach(function (b) {
    b.onclick = function () {
      state.ui.view = b.getAttribute("data-view");
      save();
      render();
    };
  });

  document.getElementById("addContainerBtn").onclick = function () {
    openModal({
      title: "New container",
      intro: "Containers keep separate worlds apart — Work, Personal, GTAW…",
      fields: [{ key: "name", label: "Container name", value: "", placeholder: "e.g. GTAW" }],
      okLabel: "Create",
      validate: function (v) { return v.name.trim() ? null : "Name is required."; },
      onSubmit: function (v) {
        const c = { id: uid(), name: v.name.trim(), projects: [] };
        state.containers.push(c);
        state.ui.containerId = c.id;
        state.ui.projectId = null;
        save();
        render();
      }
    });
  };

  document.getElementById("exportBtn").onclick = exportJSON;
  document.getElementById("importBtn").onclick = function () { document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = function (e) {
    if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("runStop").onclick = function () { stopTimer(); };

  window.addEventListener("beforeunload", function (e) {
    if (state.running) {
      e.preventDefault();
      e.returnValue = "A timer is still running. It keeps counting until you stop it.";
      return e.returnValue;
    }
  });

  render();
  tickHandle = setInterval(tick, 1000);
}

boot();
</script>
