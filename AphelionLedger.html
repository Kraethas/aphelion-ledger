/** All entries in the active container, clipped to the selected range. */
function collectRows() {
  const c = activeContainer();
  const bounds = rangeBounds(state.ui.range);
  const rows = [];
  if (!c) return rows;
  c.projects.forEach(function (p) {
    p.tasks.forEach(function (t) {
      const entries = t.entries.slice();
      if (isRunningTask(t)) entries.push({ id: "live", start: state.running.startedAt, end: now() });
      entries.forEach(function (e) {
        const s = Math.max(e.start, bounds[0]);
        const en = Math.min(e.end, bounds[1]);
        if (en > s) rows.push({ project: p, task: t, start: s, end: en, ms: en - s });
      });
    });
  });
  return rows;
}

function groupSum(rows, keyFn) {
  const map = new Map();
  rows.forEach(function (r) {
    const k = keyFn(r);
    map.set(k, (map.get(k) || 0) + r.ms);
  });
  return Array.from(map.entries()).sort(function (a, b) { return b[1] - a[1]; });
}

function barTableHTML(pairs, total) {
  if (!pairs.length) return '<div class="hint">Nothing logged in this period.</div>';
  return '<table><tbody>' + pairs.map(function (pair) {
    const pct = total ? (pair[1] / total) * 100 : 0;
    return "<tr><td style=\"width:38%\">" + esc(pair[0]) + "</td>" +
      '<td><div class="bartrack"><div class="bar" style="width:' + pct.toFixed(1) + '%"></div></div></td>' +
      '<td class="right mono nowrap" style="width:110px">' + fmtDur(pair[1]) + "</td>" +
      '<td class="right mono muted nowrap" style="width:60px">' + pct.toFixed(0) + "%</td></tr>";
  }).join("") + "</tbody></table>";
}


/** Money in Reports: what was spent in the period, and what is still owed. */
function moneySectionHTML(c, bounds) {
  const allTime = state.ui.range === "all";
  const sp = spendIn(c, bounds, allTime);
  const spent = sp.rows.reduce(function (n, r) { return n + r.amt; }, 0);
  const owed = (c.projects || []).reduce(function (n, p) { return n + projectOutstanding(p); }, 0);
  const openAccounts = [];
  (c.projects || []).forEach(function (p) {
    (p.accounts || []).forEach(function (a) {
      const out = accountOutstanding(p, a);
      if (out > 0) openAccounts.push({ project: p, account: a, out: out });
    });
  });

  if (!spent && !owed && !sp.undated) return "";

  let html = '<div class="card" style="margin-top:16px">' +
    '<div class="head"><h3 style="flex:1">Money</h3>' +
      '<span class="small muted">spend is counted when it is paid</span></div>' +
    '<div class="body">' +
      '<div class="kpis" style="margin-bottom:14px">' +
        '<div class="kpi"><div class="v mono">' + money(spent, c) + '</div><div class="k">Spent' +
          (allTime ? "" : " this period") + "</div></div>" +
        (LX(c).accounts
          ? '<div class="kpi' + (owed > 0 ? " owing" : "") + '"><div class="v mono">' + money(owed, c) +
            '</div><div class="k">Still owed</div></div>'
          : "") +
        '<div class="kpi"><div class="v mono">' + sp.rows.length + '</div><div class="k">Costs recorded</div></div>' +
      "</div>";
  if (sp.undated) {
    html += '<div class="hint" style="margin-bottom:12px">A further <b>' + money(sp.undated, c) +
      "</b> is recorded on " + esc(LX(c).tasks.toLowerCase()) +
      " with no date, so it cannot be placed in a period. Switch the range to <b>All time</b> to include it.</div>";
  }
  html += "</div>";

  if (spent) {
    const byProject = [];
    const byType = [];
    const map1 = new Map(), map2 = new Map();
    sp.rows.forEach(function (r) {
      map1.set(r.project.name, (map1.get(r.project.name) || 0) + r.amt);
      map2.set(r.task.type, (map2.get(r.task.type) || 0) + r.amt);
    });
    Array.from(map1.entries()).sort(function (a, b) { return b[1] - a[1]; }).forEach(function (e) { byProject.push(e); });
    Array.from(map2.entries()).sort(function (a, b) { return b[1] - a[1]; }).forEach(function (e) { byType.push(e); });

    function bars(pairs) {
      return '<table><tbody>' + pairs.map(function (pair) {
        const pct = spent ? (pair[1] / spent) * 100 : 0;
        return "<tr><td style=\"width:38%\">" + esc(pair[0]) + "</td>" +
          '<td><div class="bartrack"><div class="bar" style="width:' + pct.toFixed(1) + '%"></div></div></td>' +
          '<td class="right mono nowrap" style="width:110px">' + money(pair[1], c) + "</td>" +
          '<td class="right mono muted nowrap" style="width:60px">' + pct.toFixed(0) + "%</td></tr>";
      }).join("") + "</tbody></table>";
    }
    html += '<div class="wrap" style="grid-template-columns:1fr 1fr;margin-top:0">' +
      '<div class="card"><div class="head"><h3>Spend by ' + esc(LX(c).project.toLowerCase()) +
        '</h3></div><div class="body">' + bars(byProject) + "</div></div>" +

      openAccounts.sort(function (a, b) { return b.out - a.out; }).map(function (o) {
        const d = dueInfo(o.account.due, false);

          '<td><span class="type-pill">' + esc(o.account.kind) + "</span></td>" +
          '<td class="small nowrap ' + d.cls + '">' + esc(o.account.due ? d.text : "\u2014") + "</td>" +
          '<td class="right mono">' + money(accountPaid(o.project, o.account), c) + "</td>" +
          '<td class="right mono"><b class="owe">' + money(o.out, c) + "</b></td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  return html + "</div>";
}

  html += '<div class="card"><div class="head"><h3>By ' + esc(LX(c).project.toLowerCase()) + "</h3></div><div class=\"body\">" +
    barTableHTML(groupSum(rows, function (r) { return r.project.name; }), total) + "</div></div>";
  html += '<div class="card"><div class="head"><h3>By ' + esc(LX(c).typeLabel.toLowerCase()) + "</h3></div><div class=\"body\">" +
    barTableHTML(groupSum(rows, function (r) { return r.task.type; }), total) + "</div></div>";
  html += "</div>";

  html += moneySectionHTML(c, rangeBounds(state.ui.range));

  html += '<div class="card" style="margin-top:16px"><div class="head"><h3>By ' + esc(LX(c).deptLabel.toLowerCase()) + "</h3></div><div class=\"body\">" +
    barTableHTML(groupSum(rows, function (r) { return r.project.department || "(unassigned)"; }), total) + "</div></div>";

  /* task breakdown */
  const byTask = new Map();
  rows.forEach(function (r) {
    const k = r.project.id + "|" + r.task.id;
    if (!byTask.has(k)) byTask.set(k, { project: r.project, task: r.task, ms: 0 });
    byTask.get(k).ms += r.ms;
  });
  const taskRows = Array.from(byTask.values()).sort(function (a, b) { return b.ms - a.ms; });

  html += '<div class="card" style="margin-top:16px"><div class="head"><h3>' +
    esc(LX(c).task) + " detail</h3></div>";
  if (!taskRows.length) {
    html += '<div class="empty">No time logged in this period.</div>';
  } else {
    const rcols = [
      { key: "proj", label: LX(c).project, type: "select", get: function (r) { return r.project.name; } },
      { key: "task", label: LX(c).task, type: "text", get: function (r) { return r.task.title; } },
      { key: "type", label: LX(c).typeLabel, type: "select", get: function (r) { return r.task.type; } },
      { key: "person", label: LX(c).personLabel, type: "text", get: function (r) { return r.project.person; } },
      { key: "dept", label: LX(c).deptLabel, type: "select", get: function (r) { return r.project.department; } },
      { label: "Time", right: true }, { label: "Hours", right: true }
    ];
    const rshown = applyFilters("detail", rcols, taskRows);
    html += filterNoteHTML("detail", rshown.length, taskRows.length);
    html += '<div style="overflow:auto"><table>' + tableHeadHTML("detail", rcols, taskRows) + "<tbody>" +
      rshown.map(function (r) {
        return "<tr><td>" + esc(r.project.name) + "</td><td>" + esc(r.task.title) + "</td>" +
          '<td><span class="type-pill">' + esc(r.task.type) + "</span></td>" +
          "<td>" + esc(r.project.person || "—") + "</td><td>" + esc(r.project.department || "—") + "</td>" +
          '<td class="right mono nowrap">' + fmtDur(r.ms) + '</td><td class="right mono">' + fmtHours(r.ms) + "</td></tr>";
      }).join("") +
      (rshown.length ? "" : '<tr><td colspan="7" class="nomatch">Nothing matches these filters.</td></tr>') +
      "</tbody></table></div>";
  }
  html += "</div></div>";
  return html;
}

function wireReports() {
  document.querySelectorAll("#view [data-goto]").forEach(function (row) {
    row.onclick = function () {
      state.ui.projectId = row.getAttribute("data-goto");
      state.ui.view = "projects";
      state.ui.openEntries = null;
      save();
      render();
      window.scrollTo(0, 0);
    };
  });
  const sel = document.getElementById("rangeSel");
  if (sel) sel.onchange = function () { state.ui.range = sel.value; save(); render(); };
  const csv = document.getElementById("csvBtn");
  if (csv) csv.onclick = exportCSV;
}

/* =========================================================
   Import / export
   ========================================================= */
function download(filename, text, mime) {
  const blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
}

function stamp() {
  const d = new Date();
  return d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0") +
    "-" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0");
}

function exportJSON() {
  download("aphelion-ledger-backup-" + stamp() + ".json", JSON.stringify(state, null, 2), "application/json");
}

function csvCell(v) {
  const s = String(v == null ? "" : v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCSV() {
  const c = activeContainer();
  const rows = collectRows();
  const header = ["Container", "Project", "Project Status", "Person", "Department", "Task", "Type",
    "Task Status", "Assigned To", "Date Started", "Due Date", "Start", "End", "Duration", "Hours"];
  const lines = [header.map(csvCell).join(",")];
  rows.sort(function (a, b) { return a.start - b.start; }).forEach(function (r) {
    lines.push([
      c.name, r.project.name, r.project.status, r.project.person, r.project.department,
      r.task.title, r.task.type, r.task.status, memberName(c, r.task.assigneeId), r.task.started, r.task.due,
      fmtDateTime(r.start), fmtDateTime(r.end), fmtDur(r.ms), fmtHours(r.ms)
    ].map(csvCell).join(","));
  });
  const total = rows.reduce(function (s, r) { return s + r.ms; }, 0);
  lines.push(["", "", "", "", "", "", "", "", "", "", "", "", "TOTAL", fmtDur(total), fmtHours(total)].map(csvCell).join(","));

  // Costs live on tasks rather than on time entries - a paid invoice may have
  // no logged time at all - so they get their own block rather than a column
  // that would repeat itself once per session.
  const costRows = [];
  c.projects.forEach(function (p) {
    p.tasks.forEach(function (t) {
      if (!Number(t.cost)) return;
      const acc = t.accountId ? findAccount(p, t.accountId) : null;
      costRows.push([p.name, t.title, t.type, t.due, acc ? acc.name : "",
        (Number(t.cost) || 0).toFixed(2), taskSpend(t) ? "yes" : "no"]);
    });
  });
  if (costRows.length) {
    const spent = costRows.reduce(function (n, r) { return n + (r[6] === "yes" ? Number(r[5]) : 0); }, 0);
    lines.push("");
    lines.push(["COSTS (" + containerCurrency(c) + ")"].map(csvCell).join(","));
    lines.push([LX(c).project, LX(c).task, "Type", "Date", "Account", "Amount", "Counts as spend"]
      .map(csvCell).join(","));
    costRows.forEach(function (r) { lines.push(r.map(csvCell).join(",")); });
    lines.push(["", "", "", "", "TOTAL SPENT", spent.toFixed(2), ""].map(csvCell).join(","));
  }
  download("aphelion-ledger-report-" + c.name.replace(/[^\w-]+/g, "_") + "-" + stamp() + ".csv", lines.join("\r\n"), "text/csv;charset=utf-8");
}

function importJSON(file) {
  const reader = new FileReader();
  reader.onload = function () {
    let data;
    try {
      data = JSON.parse(String(reader.result));
    } catch (e) {
      alert("That file is not a valid Aphelion Ledger backup.");
      return;
    }
    if (!data || !Array.isArray(data.containers)) {
      alert("That file does not look like an Aphelion Ledger backup.");
      return;
    }
    if (!confirm("Restoring replaces everything currently in this app. Continue?")) return;
    state = data;
    normalise();
    save();
    render();
    alert("Backup restored.");
  };
  reader.readAsText(file);
}

/* =========================================================
   Boot
   ========================================================= */
function boot() {
  load();
  // Never restore focus into a filter box on a fresh load - it would steal the
  // caret and scroll the page to wherever that table happens to be.
  state.ui.focusFilter = null;

  // Probe local storage so the header can tell the user, up front, whether
  // this machine will actually keep their data between sessions.
  try {
    localStorage.setItem(STORAGE_KEY + ".probe", "1");
    localStorage.removeItem(STORAGE_KEY + ".probe");
    setStorageChip(true);
  } catch (e) {
    setStorageChip(false);
  }

  document.querySelectorAll("header .tab[data-view]").forEach(function (b) {
    b.onclick = function () {
      state.ui.view = b.getAttribute("data-view");
      save();
      render();
    };
  });

  document.getElementById("addContainerBtn").onclick = function () {
    openModal({
      title: "New container",
      intro: "Containers keep separate worlds apart — Work, Personal, a tabletop campaign…",
      fields: [
        { key: "name", label: "Container name", value: "", placeholder: "e.g. GTAW" },
        { key: "kind", label: "What is it for?", type: "select",
          options: [
            { value: "work", label: "Work — projects, tasks, departments" },
            { value: "campaign", label: "Roleplay — campaigns, sessions, players" }
          ], value: defaultKind() }
      ],
      okLabel: "Create",
      validate: function (v) { return v.name.trim() ? null : "Name is required."; },
      onSubmit: function (v) {
        const c = { id: uid(), name: v.name.trim(), kind: v.kind,
          currency: settings().currency, projects: [] };
        state.containers.push(c);
        state.ui.containerId = c.id;
        state.ui.projectId = null;
        save();
        render();
      }
    });
  };

  document.getElementById("setupBtn").onclick = openSettings;
  document.getElementById("miniBtn").onclick = miniLaunch;
  document.getElementById("shareBtn").onclick = openSharing;
  document.getElementById("exportBtn").onclick = exportJSON;
  document.getElementById("importBtn").onclick = function () { document.getElementById("importFile").click(); };
  document.getElementById("importFile").onchange = function (e) {
    if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("icsFile").onchange = function (e) {
    if (e.target.files && e.target.files[0]) importICS(e.target.files[0]);
    e.target.value = "";
  };
  document.getElementById("runStop").onclick = function () { stopTimer(); };

  window.addEventListener("beforeunload", function (e) {
    if (state.running) {
      e.preventDefault();
      e.returnValue = "A timer is still running. It keeps counting until you stop it.";
      return e.returnValue;
    }
  });

  render();
  if (state.ui.needsSetup) openFirstRun();
  tickHandle = setInterval(tick, 1000);

  if (isViewer()) {
    refreshViewer().then(function (ok) {
      if (!ok) {
        // Fall back to this person's own Ledger rather than showing nothing.
        const cfg = shareCfg();
        cfg.mode = "off";
        saveShareCfg(cfg);
        load();
        render();
      }
    });
    // A published file changes when the owner saves; check every so often.
    setInterval(function () {
      if (!isViewer()) return;
      readSnapshot().then(function (snap) {
        if (snap && snap.publishedAt && snap.publishedAt !== state.publishedAt) {
          applySnapshot(snap);
          render();
        }
      });
    }, 60000);
  } else if (isPublisher()) {
    publishNow();
  }
}

boot();
</script>
