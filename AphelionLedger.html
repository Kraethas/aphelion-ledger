<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aphelion Ledger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%232E3542'/%3E%3Ccircle cx='29' cy='32' r='20' fill='none' stroke='%23D2A45B' stroke-width='2.8'/%3E%3Ccircle cx='29' cy='32' r='16.2' fill='none' stroke='%23D2A45B' stroke-width='1.1'/%3E%3Ctext x='29' y='42' text-anchor='middle' font-family='Georgia,serif' font-size='25' fill='%23D2A45B'%3EA%3C/text%3E%3Ccircle cx='50' cy='39' r='8.4' fill='%232E3542'/%3E%3Ccircle cx='51' cy='39' r='6.2' fill='%23D2A45B'/%3E%3C/svg%3E">
<style>
:root{
  /* Aphelion brand */
  --brand:#d2a45b;          /* Aphelion gold - marks, fills, dark grounds */
  --navy:#2e3542;           /* Aphelion navy - the masthead */
  --navy-hi:#3b4353;
  /* supporting: warm sand ground, deep ink, and a slate blue for "in progress" */
  --bg:#f1eee7; --panel:#ffffff; --panel-2:#faf8f3; --border:#e4ded2;
  --text:#23272f; --muted:#77716a;
  --accent:#8a6520;         /* gold darkened enough to read as text on light */
  --accent-soft:#f7efdf;
  --info:#37687f; --info-soft:#e4eef3;
  --green:#1f9d55; --green-soft:#e6f6ec; --amber:#b06f00; --amber-soft:#fdf3e0;
  --red:#c8372d; --red-soft:#fdeceb; --purple:#6b40c4; --purple-soft:#efe9fb;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.05);
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --brand:#d8ac66; --navy:#242a35; --navy-hi:#2f3746;
    --bg:#161a21; --panel:#1d222b; --panel-2:#232935; --border:#2f3644;
    --text:#e7e3db; --muted:#98a0ac; --accent:#ddb574; --accent-soft:#33291a;
    --info:#6fa5be; --info-soft:#172a33;
    --green:#4ec27f; --green-soft:#16301f; --amber:#e0a34a; --amber-soft:#33270f;
    --red:#ef6a5e; --red-soft:#3a1d1a; --purple:#a58bee; --purple-soft:#26203a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650}
a{color:var(--accent)}

/* ---------- header ---------- */
header{
  background:var(--navy);border-bottom:1px solid rgba(255,255,255,.09);
  padding:9px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  position:sticky;top:0;z-index:20;color:#efebe3;
}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand .logo{width:30px;height:30px;flex:none}
.brand .name{font-weight:700;font-size:16px;letter-spacing:.4px;color:var(--brand)}
.brand .prod{font-weight:500;font-size:13.5px;color:rgba(255,255,255,.6);letter-spacing:.2px}
header .sep{background:rgba(255,255,255,.15)}
header .tab{color:rgba(255,255,255,.66)}
header .tab:hover{background:rgba(255,255,255,.08);color:#fff}
header .tab.active{background:rgba(210,164,91,.18);color:var(--brand);font-weight:600}
header .btn{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.17);color:#ede9e1;box-shadow:none}
header .btn:hover{background:rgba(210,164,91,.14);border-color:var(--brand);color:var(--brand)}
header .btn.ghost{background:transparent;border-color:transparent;color:rgba(255,255,255,.7)}
header .btn.ghost:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
header .btn.ghost.on{background:rgba(210,164,91,.18);border-color:var(--brand);color:var(--brand)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tab{
  background:transparent;border:1px solid transparent;padding:6px 12px;border-radius:99px;
  cursor:pointer;color:var(--muted);white-space:nowrap;
}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab.active{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.sep{width:1px;height:22px;background:var(--border)}
.grow{flex:1 1 auto}

/* ---------- buttons ---------- */
.btn{
  background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:6px 11px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow);
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#2a3040;font-weight:600}
.btn.primary:hover{filter:brightness(1.06);color:#2a3040}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text);border-color:var(--border)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.btn.go{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.go:hover{filter:brightness(1.08);color:#fff}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.stop:hover{filter:brightness(1.08);color:#fff}

/* ---------- running bar ---------- */
#runbar{
  display:none;align-items:center;gap:12px;padding:8px 16px;
  background:var(--green-soft);border-bottom:1px solid var(--border);color:var(--text);
}
#runbar.on{display:flex}
#runbar .dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
#runbar .what{font-weight:600}
#runbar .clock{font-variant-numeric:tabular-nums;font-size:19px;font-weight:700;letter-spacing:.5px}

/* ---------- layout ---------- */
main{flex:1 1 auto;overflow:auto;padding:16px;display:block}
.wrap{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.card .body{padding:14px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- project list ---------- */
.plist{max-height:calc(100vh - 220px);overflow:auto}
.pitem{
  padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;
  gap:8px;align-items:flex-start;
}
.pitem:hover{background:var(--panel-2)}
.pitem.active{background:var(--accent-soft)}
.pitem .nm{font-weight:600;flex:1;word-break:break-word}
.pgrip{
  flex:none;color:var(--muted);opacity:.35;cursor:grab;font-size:12px;line-height:1.1;
  letter-spacing:-2px;padding:2px 1px 0 0;margin-left:-4px;touch-action:none;user-select:none;
}
.pitem:hover .pgrip{opacity:.85}
.pgrip:active{cursor:grabbing}
.pitem.dragging{opacity:.65;background:var(--accent-soft);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.pitem .meta{display:flex;gap:8px;align-items:center;margin-top:3px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 7px;border-radius:99px;white-space:nowrap;font-weight:600}
.s-ns{background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
.s-dev{background:var(--amber-soft);color:var(--amber)}
.s-done{background:var(--green-soft);color:var(--green)}
.s-rec{background:var(--purple-soft);color:var(--purple)}

/* task statuses */
.t-ns{background:var(--panel-2);color:var(--muted);border:1px solid var(--border)}
.t-prog{background:var(--info-soft);color:var(--info)}
.t-wait{background:var(--amber-soft);color:var(--amber)}
.t-rev{background:var(--purple-soft);color:var(--purple)}
.t-pause{background:var(--panel-2);color:var(--muted);border:1px dashed var(--border-strong,var(--muted))}
.t-done{background:var(--green-soft);color:var(--green)}
.t-cancel{background:var(--red-soft);color:var(--red)}
.t-recur{background:var(--panel-2);color:var(--info);border:1px dashed var(--info)}

/* assignment + dates in the task table */
.who{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.who .me{color:var(--muted)}
.who .other{font-weight:600}
.dates{display:flex;flex-direction:column;gap:2px;font-size:12px;white-space:nowrap}
.dates span{color:var(--muted)}
.dates b{font-weight:600;color:var(--text)}
.closed{text-decoration:line-through;opacity:.55}

/* ---------- forms ---------- */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
input[type=text],input[type=date],input[type=number],select,textarea{
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 9px;width:100%;
  font-weight:400;color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
textarea{resize:vertical;min-height:64px}

/* ---------- tasks ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.running{background:var(--green-soft)}
.ttitle{font-weight:600;word-break:break-word}
.type-pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.right{text-align:right}
.nowrap{white-space:nowrap}
.rowacts{display:flex;gap:5px;justify-content:flex-end}

/* ---------- milestones ---------- */
.ms{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border)}
.ms:last-child{border-bottom:none}
.ms .lbl{flex:1}
.ms.done .lbl{text-decoration:line-through;color:var(--muted)}
.due-over{color:var(--red);font-weight:600}
.due-soon{color:var(--amber);font-weight:600}

/* ---------- planner ---------- */
.planwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;max-width:1700px;margin:0 auto}
@media (max-width:1150px){.planwrap{grid-template-columns:1fr}}
.plannav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plannav .rng{font-weight:600;white-space:nowrap}
.plangrid{display:grid;grid-template-columns:56px repeat(7,minmax(0,1fr))}
.gutter{position:relative}
.gutter .hr{position:absolute;right:7px;font-size:10.5px;color:var(--muted);transform:translateY(-7px)}
.dayhead{padding:7px 4px;text-align:center;border-left:1px solid var(--border);border-bottom:1px solid var(--border)}
.dayhead .dn{font-weight:600;font-size:12.5px}
.dayhead .dd{color:var(--muted);font-size:11px}
.dayhead.today .dn{color:var(--accent)}
.dayhead.today{background:var(--accent-soft)}
.plancol{position:relative;border-left:1px solid var(--border);background:var(--panel)}
.plancol.today{background:var(--accent-soft)}
.plancol .hline{position:absolute;left:0;right:0;border-top:1px solid var(--border);pointer-events:none}
.plancol .hline.half{border-top-style:dotted;opacity:.55}
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--red);pointer-events:none;z-index:5}
.block{
  position:absolute;border-radius:5px;padding:2px 5px;font-size:11.5px;line-height:1.25;
  overflow:hidden;cursor:grab;background:var(--accent-soft);color:var(--text);
  border-left:3px solid var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:2;
}
.block .bt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block .bs{color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block.event{border-left-color:var(--info);background:var(--info-soft)}
.block.ghost{
  border:1px dashed var(--border);border-left:3px solid var(--border);
  background:var(--panel-2);color:var(--muted);opacity:.72;pointer-events:none;box-shadow:none;
  z-index:1;   /* behind your own blocks, and free to overlap them */
}
.block.actual{
  border:1px solid var(--green);border-left:3px solid var(--green);
  background:var(--green-soft);color:var(--text);pointer-events:none;z-index:2;box-shadow:none;
}
.block.actual .bs{color:var(--green);opacity:.9}
.block.actual.live{border-style:dashed}
.btn.sm.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.block.dragging{opacity:.9;cursor:grabbing;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.block .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.planpanel .grp{
  padding:7px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700;color:var(--muted);
}
.planpanel .grp.over{color:var(--red)}
.planpanel .pt{padding:9px 12px;border-bottom:1px solid var(--border);cursor:grab;display:flex;flex-direction:column;gap:2px}
.planpanel .pt:hover{background:var(--panel-2)}
.planpanel .pt .pn{font-weight:600;font-size:13px}
.planpanel .pt .pm{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.planpanel .list{max-height:calc(100vh - 260px);overflow:auto}
.dragghost{
  position:fixed;z-index:100;pointer-events:none;padding:5px 10px;border-radius:6px;
  background:var(--brand);color:#2a3040;font-size:12px;font-weight:600;
  box-shadow:0 8px 22px rgba(0,0,0,.3);max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.plansum{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.plansum b{font-variant-numeric:tabular-nums}

/* ---------- plot arcs, cast, multi-select ---------- */
.checklist{display:flex;flex-direction:column;gap:5px;max-height:190px;overflow:auto;
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--panel-2)}
.chk{display:flex;align-items:center;gap:8px;font-weight:400;color:var(--text);font-size:13.5px;cursor:pointer}
.chk input{width:auto;margin:0}
.arclbl{cursor:pointer;display:flex;align-items:center;gap:7px}
.arclbl:hover{color:var(--accent)}
.arccount{
  font-size:10.5px;font-weight:700;min-width:18px;height:18px;padding:0 5px;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;
}
.arcbox{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin:2px 0 8px}
.arcrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.arcrow:last-child{border-bottom:none}
.arcrow .an{flex:1;font-weight:600;font-size:13px;min-width:120px}
.att{color:var(--accent);font-weight:600}
tr.filters td{padding:4px 6px;border-bottom:1px solid var(--border);background:var(--panel-2)}
tr.filters input,tr.filters select{
  padding:3px 6px;font-size:12px;border-radius:6px;background:var(--panel);
  border:1px solid var(--border);width:100%;min-width:70px;
}
tr.filters input.on,tr.filters select.on{border-color:var(--accent);color:var(--accent);font-weight:600}
tr.filters input::placeholder{color:var(--muted);opacity:.7}
.fnote{
  padding:8px 14px;background:var(--accent-soft);color:var(--accent);
  font-size:12.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  border-bottom:1px solid var(--border);
}
.fnote b{font-variant-numeric:tabular-nums}
td.nomatch{text-align:center;color:var(--muted);padding:22px 10px;font-size:13px}
#shareBar{display:none;align-items:center;gap:10px;padding:7px 16px;border-bottom:1px solid var(--border);font-size:13px}
.sharebar{display:flex;align-items:center;gap:10px;width:100%}
.sharebar .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sharebar.view{background:var(--info-soft);color:var(--info)}
.sharebar.view .dot{background:var(--info)}
.sharebar.pub{background:var(--accent-soft);color:var(--accent)}
.sharebar.pub .dot{background:var(--accent);animation:pulse 2.4s infinite}
.sharebar .muted{color:inherit;opacity:.75}

/* a viewer is looking, not editing */
body.viewer [data-act],
body.viewer [data-start],
body.viewer [data-stop],
body.viewer [data-add-time],
body.viewer [data-edit-task],
body.viewer [data-del-task],
body.viewer [data-edit-member],
body.viewer [data-del-member],
body.viewer [data-ms-edit],
body.viewer [data-ms-del],
body.viewer [data-edit-char],
body.viewer [data-del-char],
body.viewer [data-edit-account],
body.viewer [data-del-account],
body.viewer [data-doc-add],
body.viewer [data-doc-del],
body.viewer .rz,
body.viewer #addContainerBtn,
body.viewer #importBtn,
body.viewer #exportBtn,
body.viewer #icsBtn,
body.viewer #runStop,
body.viewer #miniBtn,
body.viewer .pgrip{display:none !important}
body.viewer [data-ms-toggle]{pointer-events:none;opacity:.55}
body.viewer [data-field],
body.viewer tr.filters select,
body.viewer tr.filters input{opacity:1}
body.viewer [data-field]{pointer-events:none;opacity:.8}
body.viewer .plancol,
body.viewer .planpanel .pt,
body.viewer .block{cursor:default}
.owe{color:var(--amber)}
.clear{color:var(--green)}
.kpi.owing{background:var(--amber-soft);border-color:var(--amber)}
.kpi.owing .v{color:var(--amber)}
.docs{display:flex;flex-direction:column;gap:2px}
.docrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.docrow:last-of-type{border-bottom:none}
.dicon{opacity:.7}
.dname{font-weight:600;font-size:13px;flex:1;min-width:140px;word-break:break-all}
.dpath{font-family:ui-monospace,Consolas,monospace;font-size:11px;opacity:.75}
.docsub{border-top:1px dashed var(--border);margin-top:8px;padding-top:4px}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:var(--panel-2)}

/* ---------- printable record ---------- */
#printRoot{display:none}
.psheet{
  color:#14181d;background:#fff;font-family:"Segoe UI",system-ui,Arial,sans-serif;
  display:flex;flex-direction:column;
}
.phead{display:flex;align-items:flex-start;gap:14px;border-bottom:2px solid #2e3542;padding-bottom:8px;margin-bottom:10px}
.pbrand{display:flex;align-items:center;gap:10px;flex:1}
.plogo{width:34px;height:34px;flex:none}
.pt1{font-size:15px;font-weight:700;letter-spacing:.2px}
.pt2{font-size:12.5px;color:#4a5461}
.ptot{display:flex;gap:16px;text-align:right}
.ptot div{display:flex;flex-direction:column}
.ptot b{font-size:16px;font-variant-numeric:tabular-nums}
.ptot span{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#6b7581}
.pgrid{display:grid;grid-template-columns:34px repeat(var(--cols),1fr);flex:1;min-height:0}
.pgut{position:relative}
.pgut .ph{position:absolute;right:5px;font-size:8px;color:#6b7581;transform:translateY(-4px)}
.pcol{border-left:1px solid #c9d0d8;display:flex;flex-direction:column;min-width:0}
.pch{font-size:9.5px;font-weight:700;text-align:center;padding:2px 0;border-bottom:1px solid #c9d0d8;color:#2e3542}
.pbody{position:relative;flex:1;min-height:0}
.pline{position:absolute;left:0;right:0;border-top:1px solid #e6eaee}
.pblk{position:absolute;overflow:hidden;border-radius:2px;padding:1px 3px;box-sizing:border-box}
.pblk.plan{border:1px dashed #9aa4b0;background:transparent;color:#6b7581}
.pblk.act{background:#e8dcc4;border:1px solid #b9995c;border-left:3px solid #8a6520;color:#241f16}
.pblk .pbl{display:block;font-size:8px;font-weight:700;line-height:1.15;overflow:hidden}
.pblk .pbs{display:block;font-size:7px;line-height:1.1;color:#4a5461;font-variant-numeric:tabular-nums}
.pfoot{display:flex;justify-content:space-between;border-top:1px solid #c9d0d8;margin-top:8px;padding-top:5px;font-size:8.5px;color:#6b7581}
.pbreak{break-before:page;page-break-before:always}
.pdet{color:#14181d;font-family:"Segoe UI",system-ui,Arial,sans-serif}
.pdet h2{font-size:15px;margin:0 0 10px;border-bottom:2px solid #2e3542;padding-bottom:6px}

  html,body{background:#fff !important;height:auto !important;display:block !important}
  body.printing > header,

  body.printing > main,
  body.printing > #modalRoot{display:none !important}

  .pdet{padding-top:2mm}
}

#modalRoot{position:fixed;inset:0;background:rgba(10,15,25,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}

<script>
"use strict";

/* =========================================================
   Constants
   ========================================================= */
// Deliberately unchanged across the rename: this key is where existing
// users' data already lives, and renaming it would orphan every install.
const STORAGE_KEY = "personalTimeTracker.v1";

const STATUSES = ["Not Started", "In Development", "Completed", "Recurring Maintenance"];
const STATUS_CLASS = {
  "Not Started": "s-ns",
  "In Development": "s-dev",
  "Completed": "s-done",
  "Recurring Maintenance": "s-rec"
};

const TASK_TYPES = [
  "Meeting / Call",
  "Development Work",
  "Presentation / E-mail Preparation",
  "Research & Analysis",
  "Documentation",
  "Review / QA / Testing",
  "Planning & Scoping",
  "Support & Troubleshooting",
  "Training & Learning",
  "Admin & Reporting",
  "Travel",
  "Other",
  "Charge",
  "Payment"
];

const TASK_STATUSES = [
  "Not Started",
  "In Progress",
  "Waiting on Other Person/Team",
  "In Review / Approval",
  "Paused",
  "Completed",
  "Cancelled",
  "Recurring"
];

const TASK_STATUS_CLASS = {
  "Not Started": "t-ns",
  "In Progress": "t-prog",
  "Waiting on Other Person/Team": "t-wait",
  "In Review / Approval": "t-rev",
  "Paused": "t-pause",
  "Completed": "t-done",
  "Cancelled": "t-cancel",
  "Recurring": "t-recur"
};

/* Statuses that take a task off your plate - used for "open" counts and styling. */
function isTaskClosed(t) {
  return CLOSED_STATUSES.indexOf(t.status) >= 0;
}

/* ---------- campaign mode ----------
   The same machinery, a different vocabulary. A container declares its kind
   and every label, status list and type list is drawn from the lexicon. */

const CAMPAIGN_STATUSES = ["Planned", "Active", "On Hiatus", "Completed", "Abandoned"];
const CAMPAIGN_STATUS_CLASS = {
  "Planned": "s-ns", "Active": "s-dev", "On Hiatus": "t-pause",
  "Completed": "s-done", "Abandoned": "t-cancel"
};

const SESSION_STATUSES = [
  "Scheduled", "Confirmed", "Awaiting Players", "Prepped", "Played", "Postponed", "Cancelled",
  "Recurring"
];
const SESSION_STATUS_CLASS = {
  "Scheduled": "t-ns", "Confirmed": "t-prog", "Awaiting Players": "t-wait",
  "Prepped": "t-rev", "Played": "t-done", "Postponed": "t-pause", "Cancelled": "t-cancel",
  "Recurring": "t-recur"
};

const SESSION_TYPES = [
  "Live Session",
  "GM Prep",
  "Session Zero / Character Creation",
  "Worldbuilding",
  "Rules Reading",
  "Recap & Notes",
  "Maps & Assets",
  "Downtime / Play-by-post",
  "Scheduling & Admin",
  "Other",
  "Campaign cost"
];

const CHAR_STATES = ["Active", "Retired", "Deceased"];
const CHAR_STATE_CLASS = { "Active": "t-done", "Retired": "t-pause", "Deceased": "t-cancel" };

/* Statuses that take an item off the board, across both vocabularies. */
const CLOSED_STATUSES = ["Completed", "Cancelled", "Played"];

/**
 * A standing commitment - a daily stand-up, a weekly game. It never finishes,
 * so it is not closed, but counting it as an open to-do would inflate the
 * figure permanently and it would never come down.
 */
function isTaskRecurring(t) { return t.status === "Recurring"; }

const LEX = {
  work: {
    kindName: "Work", other: "campaign",
    project: "Project", projects: "Projects", newProject: "New project",
    task: "Task", tasks: "Tasks",
    member: "Member", members: "Members", memberCol: "Team",
    personLabel: "Person / requester", personPh: "e.g. Jane Doe",
    deptLabel: "Department", deptPh: "e.g. Finance",
    milestone: "Milestone", milestones: "Milestones",
    dueLabel: "Due date", startedLabel: "Date started",
    typeLabel: "Type of work",
    statuses: STATUSES, statusClass: STATUS_CLASS,
    taskStatuses: TASK_STATUSES, taskStatusClass: TASK_STATUS_CLASS,
    taskTypes: TASK_TYPES, defaultType: "Development Work",
    roster: false, accounts: true
  },
  campaign: {
    kindName: "Campaign", other: "work",
    project: "Campaign", projects: "Campaigns", newProject: "New campaign",
    task: "Session", tasks: "Sessions",
    member: "Player", members: "Players", memberCol: "Group",
    personLabel: "Game Master", personPh: "e.g. Alex",
    deptLabel: "System", deptPh: "e.g. D&D 5e",
    milestone: "Plot arc", milestones: "Plot arcs",
    dueLabel: "Session date", startedLabel: "Prep started",
    typeLabel: "Activity",
    statuses: CAMPAIGN_STATUSES, statusClass: CAMPAIGN_STATUS_CLASS,
    taskStatuses: SESSION_STATUSES, taskStatusClass: SESSION_STATUS_CLASS,
    taskTypes: SESSION_TYPES, defaultType: "Live Session",
    roster: true, accounts: false
  }
};

function kindOf(c) { return (c && c.kind === "campaign") ? "campaign" : "work"; }
/** Lexicon for a container, defaulting to the active one. */
function LX(c) { return LEX[kindOf(c === undefined ? activeContainer() : c)]; }

const SELF = "Myself";
const NEW_MEMBER = "__new__";

/* ---------- members ----------
   Each container keeps its own list of people, because containers hold
   separate worlds: your work colleagues have no business in Personal. */

function containerMembers(c) {
  return (c && Array.isArray(c.members)) ? c.members : [];
}
function findMember(c, id) {
  return containerMembers(c).find(function (m) { return m.id === id; }) || null;
}
function selfMember(c) {
  const list = containerMembers(c);
  return list.find(function (m) { return m.self; }) || list[0] || null;
}
function memberName(c, id) {
  const m = findMember(c, id);
  return m ? m.name : "Unassigned";
}
/** Options for an assignment dropdown: every member, then "add someone new". */
function memberOptions(c) {
  const opts = containerMembers(c).map(function (m) {
    return { value: m.id, label: m.team ? m.name + " — " + m.team : m.name };
  });
  opts.push({ value: NEW_MEMBER, label: "+ Add someone new…" });
  return opts;
}
/**
 * Attendance across sessions that actually happened (status Played).
 * Pass a project to scope it to one campaign - across a whole container the
 * denominator would include campaigns the player is not even in.
 */
function attendanceFor(c, memberId, project) {
  let played = 0, attended = 0;
  const scope = project ? [project] : (c && c.projects || []);
  scope.forEach(function (p) {
    p.tasks.forEach(function (t) {
      if (t.status !== "Played") return;
      played++;
      if ((t.attendance || []).indexOf(memberId) >= 0) attended++;
    });
  });
  return { played: played, attended: attended };
}

/** Per-campaign attendance for a player, only where they actually appear. */
function attendanceByCampaign(c, memberId) {
  const out = [];
  (c && c.projects || []).forEach(function (p) {
    const a = attendanceFor(c, memberId, p);
    const cast = (p.roster || []).some(function (r) { return r.memberId === memberId; });
    if (a.attended || cast) out.push({ project: p, played: a.played, attended: a.attended });
  });
  return out;
}

/** Shared field list for the new-session and edit-session forms. */
function taskFieldsFor(c, p, t) {
  const lex = LX(c);
  const campaign = kindOf(c) === "campaign";
  const arcOpts = p.milestones.map(function (m) { return { value: m.id, label: m.label }; });
  const fields = [
    { key: "title", label: lex.task, value: t ? t.title : "",
      placeholder: campaign ? "e.g. Session 12 - Into the catacombs" : "e.g. Kick-off call with Finance" },
    { key: "type", label: lex.typeLabel, type: "select", options: lex.taskTypes,
      value: t ? t.type : lex.defaultType },
    { key: "status", label: "Status", type: "select", options: lex.taskStatuses,
      value: t ? t.status : lex.taskStatuses[0] },
    { key: "assigneeId", label: campaign ? "Run by" : "Assigned to", type: "select",
      options: memberOptions(c), value: t ? t.assigneeId : selfMember(c).id },
    { key: "started", label: lex.startedLabel, type: "date", value: t ? t.started : "" },
    { key: "due", label: lex.dueLabel, type: "date", value: t ? t.due : "" },
    { key: "arcIds", label: lex.milestones, type: "checks", value: t ? (t.arcIds || []) : [],
      options: arcOpts, empty: "No " + lex.milestones.toLowerCase() + " yet - add one first to link it." }
  ];
  fields.push({ key: "cost", label: "Cost (" + containerCurrency(c) + ", optional)", type: "number",
    value: t && t.cost ? t.cost : "", min: 0, step: "0.01" });
  if (!campaign && (p.accounts || []).length) {
    fields.push({
      key: "accountId", label: "Against which bill or balance", type: "select",
      options: [{ value: "", label: "\u2014 none \u2014" }].concat(
        p.accounts.map(function (a) { return { value: a.id, label: a.name }; })),
      value: t ? (t.accountId || "") : ""
    });
  }
  if (campaign) {
    fields.push({
      key: "attendance", label: "Who was there", type: "checks",
      value: t ? (t.attendance || []) : [],
      options: containerMembers(c).map(function (m) { return { value: m.id, label: m.name }; }),
      empty: "No players yet - add them under Players."
    });
  }
  fields.push({ key: "notes", label: t ? "Notes" : "Notes (optional)", type: "textarea",
    value: t ? t.notes : "" });
  return fields;
}

/** Every character a member has played, across the container's campaigns. */
function charactersOf(c, memberId) {
  const out = [];
  (c && c.projects || []).forEach(function (p) {
    (p.roster || []).forEach(function (r) {
      if (r.memberId === memberId) out.push({ project: p, entry: r });
    });
  });
  return out;
}

/** How many tasks in this container point at a given member. */
function memberTaskCount(c, id) {
  let n = 0;
  c.projects.forEach(function (p) {
    p.tasks.forEach(function (t) { if (t.assigneeId === id) n++; });
  });
  return n;
}

/** Shared validation for the new-task and edit-task forms. */
function validateTaskDates(v) {
  if (!v.title.trim()) return "Task name is required.";
  if (v.started && v.due && v.due < v.started) {
    return "The due date is before the start date. Swap them, or clear one.";
  }
  return null;
}

/* =========================================================
   State
   ========================================================= */
let state = null;
let tickHandle = null;

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function defaultState() {
  return {
    version: 1,
    containers: [
      { id: uid(), name: "Work", projects: [] },
      { id: uid(), name: "Personal", projects: [] }
    ],
    running: null, // {containerId, projectId, taskId, startedAt}
    ui: { containerId: null, projectId: null, view: "projects", range: "all" }
  };
}

function load() {
  let raw = null;
  try {
    raw = localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    raw = null;
  }
  if (!raw) {
    state = defaultState();
    state.ui.containerId = state.containers[0].id;
    state.ui.needsSetup = true;   // ask what this is for, rather than assuming an office
    normalise();   // a fresh install still needs its member lists seeding
    save();
    return;
  }
  try {
    state = JSON.parse(raw);
  } catch (e) {
    state = defaultState();
  }
  normalise();
}

function normalise() {
  if (!state || typeof state !== "object") state = defaultState();
  if (!Array.isArray(state.containers) || !state.containers.length) {
    state.containers = defaultState().containers;
  }
  state.ui = state.ui || {};
  settings();
  state.ui.view = ["reports", "members", "planner"].indexOf(state.ui.view) >= 0 ? state.ui.view : "projects";
  state.ui.range = state.ui.range || "all";
  state.containers.forEach(function (c) {
    c.id = c.id || uid();
    c.name = c.name || "Untitled";
    c.kind = c.kind === "campaign" ? "campaign" : "work";
    c.currency = (typeof c.currency === "string" && c.currency.trim()) ? c.currency.trim() : "€";
    c.shared = !!c.shared;   // opt in, never on by default
    const lex = LEX[c.kind];
    c.projects = Array.isArray(c.projects) ? c.projects : [];

    // Every container has a member list, and it always starts with you.
    // Planned blocks, keyed by date. Intent only - never time entries.
    c.plan = (c.plan && typeof c.plan === "object") ? c.plan : {};
    Object.keys(c.plan).forEach(function (iso) {
      if (!Array.isArray(c.plan[iso]) || !c.plan[iso].length) { delete c.plan[iso]; return; }
      c.plan[iso].forEach(function (b) {
        b.id = b.id || uid();
        b.kind = b.kind === "event" ? "event" : "task";
        b.label = b.label || "";
        b.note = b.note || "";
        b.start = /^\d{1,2}:\d{2}$/.test(b.start) ? b.start : "09:00";
        b.end = /^\d{1,2}:\d{2}$/.test(b.end) ? b.end : "10:00";
      });
      // drop blocks whose task has since been deleted
      c.plan[iso] = c.plan[iso].filter(function (b) {
        return b.kind === "event" || !!findTaskById(c, b.taskId);
      });
      if (!c.plan[iso].length) delete c.plan[iso];
    });

    c.members = Array.isArray(c.members) ? c.members : [];
    c.members.forEach(function (m) {
      m.id = m.id || uid();
      m.name = (m.name || "").trim() || "Unnamed";
      m.team = m.team || "";
      m.email = m.email || "";
      m.self = !!m.self;
    });
    if (!c.members.some(function (m) { return m.self; })) {
      c.members.unshift({ id: uid(), name: SELF, team: "", email: "", self: true });
    }
    const me = selfMember(c);
    c.projects.forEach(function (p) {
      p.id = p.id || uid();
      p.name = p.name || "Untitled project";
      p.description = p.description || "";
      p.person = p.person || "";
      p.department = p.department || "";
      // Statuses come from the container's vocabulary; if a container changes
      // kind, map by position so "second status" stays "second status".
      if (lex.statuses.indexOf(p.status) < 0) {
        const idx = LEX[lex.other].statuses.indexOf(p.status);
        p.status = lex.statuses[idx >= 0 && idx < lex.statuses.length ? idx : 0];
      }
      p.milestones = Array.isArray(p.milestones) ? p.milestones : [];
      // Characters belong to a campaign, not to a player: one person can play
      // several characters here, and the same person elsewhere is someone else.
      // Financial accounts are deliberately separate from milestones: a
      // milestone is a checkpoint in the work, an account is a balance, and a
      // payment belongs to exactly one account rather than many.
      p.accounts = Array.isArray(p.accounts) ? p.accounts : [];
      p.accounts.forEach(function (a) {
        a.id = a.id || uid();
        a.name = (a.name || "").trim() || "Untitled";
        a.kind = ACCOUNT_KINDS.indexOf(a.kind) >= 0 ? a.kind : ACCOUNT_KINDS[0];
        a.opening = Number(a.opening) || 0;
        a.due = a.due || "";
        a.note = a.note || "";
        a.docs = Array.isArray(a.docs) ? a.docs : [];
      });
      p.docs = Array.isArray(p.docs) ? p.docs : [];
      p.docFolder = p.docFolder || "";
      p.roster = Array.isArray(p.roster) ? p.roster : [];
      p.roster = p.roster.filter(function (r) { return !!findMember(c, r.memberId); });
      p.roster.forEach(function (r) {
        r.id = r.id || uid();
        r.name = (r.name || "").trim() || "Unnamed";
        r.archetype = r.archetype || "";
        r.state = CHAR_STATES.indexOf(r.state) >= 0 ? r.state : "Active";
        r.note = r.note || "";
      });
      p.tasks = Array.isArray(p.tasks) ? p.tasks : [];
      p.milestones.forEach(function (m) {
        m.id = m.id || uid();
        m.label = m.label || "";
        m.due = m.due || "";
        m.done = !!m.done;
        m.docs = Array.isArray(m.docs) ? m.docs : [];
      });
      p.tasks.forEach(function (t) {
        t.id = t.id || uid();
        t.title = t.title || "Untitled task";
        // Types map by position too, so switching a container's kind and back
        // returns the original value rather than collapsing everything to Other.
        if (lex.taskTypes.indexOf(t.type) < 0) {
          const ti = LEX[lex.other].taskTypes.indexOf(t.type);
          t.type = (ti >= 0 && ti < lex.taskTypes.length) ? lex.taskTypes[ti] : "Other";
        }
        t.notes = t.notes || "";
        // v1.0 tasks carried a done flag; it becomes a status.
        if (lex.taskStatuses.indexOf(t.status) < 0) {
          const prev = LEX[lex.other].taskStatuses.indexOf(t.status);
          t.status = prev >= 0 && prev < lex.taskStatuses.length
            ? lex.taskStatuses[prev]
            : (t.done ? lex.taskStatuses[lex.taskStatuses.length - 3] : lex.taskStatuses[0]);
        }
        delete t.done;
        // Free-text assignees become real member records, matched by name.
        if (!t.assigneeId || !findMember(c, t.assigneeId)) {
          const written = (typeof t.assignee === "string") ? t.assignee.trim() : "";
          if (!written || written === SELF) {
            t.assigneeId = me.id;
          } else {
            const hit = c.members.find(function (m) {
              return m.name.toLowerCase() === written.toLowerCase();
            });
            if (hit) {
              t.assigneeId = hit.id;
            } else {
              const added = { id: uid(), name: written, team: "", email: "", self: false };
              c.members.push(added);
              t.assigneeId = added.id;
            }
          }
        }
        delete t.assignee;
        t.started = t.started || "";
        t.due = t.due || "";
        // Who was at the table. Only meaningful for sessions, harmless otherwise.
        t.cost = Number(t.cost) || 0;
        t.accountId = (t.accountId && findAccount(p, t.accountId)) ? t.accountId : "";
        t.docs = Array.isArray(t.docs) ? t.docs : [];
        t.attendance = Array.isArray(t.attendance) ? t.attendance : [];
        t.attendance = t.attendance.filter(function (id) { return !!findMember(c, id); });
        // Sessions can belong to several plot arcs at once.
        t.arcIds = Array.isArray(t.arcIds) ? t.arcIds : [];
        t.arcIds = t.arcIds.filter(function (id) {
          return p.milestones.some(function (m) { return m.id === id; });
        });
        t.entries = Array.isArray(t.entries) ? t.entries : [];
        t.entries.forEach(function (e) {
          e.id = e.id || uid();
          e.start = Number(e.start) || 0;
          e.end = Number(e.end) || 0;
        });
      });
    });
  });
  if (!findContainer(state.ui.containerId)) state.ui.containerId = state.containers[0].id;
  if (state.running && !findTask(state.running)) state.running = null;
}

let saveWarned = false;
let storageOK = true;

function setStorageChip(ok) {
  storageOK = ok;
  const chip = document.getElementById("storeChip");
  if (!chip) return;
  chip.className = "badge " + (ok ? "s-done" : "s-ns");
  chip.textContent = ok ? "✓ Saved" : "⚠ Not saving";
  if (!ok) {
    chip.style.background = "var(--red-soft)";
    chip.style.color = "var(--red)";
    chip.style.borderColor = "transparent";
    chip.title = "This browser is blocking local storage. Your data will be lost on reload — use Backup.";
  } else {
    chip.style.background = "";
    chip.style.color = "";
    chip.title = "Your data is saved in this browser automatically.";
  }
}

function save() {
  // A viewer is looking at somebody else's data. Writing it to this browser
  // would overwrite their own Ledger, which shares the same storage.
  if (state && state.viewer) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    schedulePublish();
    if (!storageOK) setStorageChip(true);
  } catch (e) {
    setStorageChip(false);
    if (!saveWarned) {
      saveWarned = true;
      alert(
        "This browser refused to save data locally (storage blocked or full).\n\n" +
        "Your work is still on screen, but it will NOT survive a reload.\n" +
        "Use the Backup button to save a .json file, then Restore it later."
      );
    }
  }
}

/* =========================================================
   Lookups
   ========================================================= */
function findContainer(id) {
  return state.containers.find(function (c) { return c.id === id; }) || null;
}
function activeContainer() {
  return findContainer(state.ui.containerId);
}
function findProject(containerId, projectId) {
  const c = findContainer(containerId);
  if (!c) return null;
  return c.projects.find(function (p) { return p.id === projectId; }) || null;
}
function activeProject() {
  return findProject(state.ui.containerId, state.ui.projectId);
}
function findTask(ref) {
  const p = findProject(ref.containerId, ref.projectId);
  if (!p) return null;
  return p.tasks.find(function (t) { return t.id === ref.taskId; }) || null;
}

/* =========================================================
   Time helpers
   ========================================================= */
function now() { return Date.now(); }

function taskLoggedMs(task) {
  return task.entries.reduce(function (sum, e) {
    return sum + Math.max(0, (e.end || 0) - (e.start || 0));
  }, 0);
}
function isRunningTask(task) {
  return !!(state.running && state.running.taskId === task.id);
}
function taskTotalMs(task) {
  let ms = taskLoggedMs(task);
  if (isRunningTask(task)) ms += Math.max(0, now() - state.running.startedAt);
  return ms;
}
function projectTotalMs(project) {
  return project.tasks.reduce(function (s, t) { return s + taskTotalMs(t); }, 0);
}

function fmtClock(ms) {
  const total = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  const s = total % 60;
  return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
}
function fmtDur(ms) {
  const total = Math.floor(Math.max(0, ms) / 1000);
  const h = Math.floor(total / 3600);
  const m = Math.floor((total % 3600) / 60);
  if (h === 0 && m === 0) return total + "s";
  if (h === 0) return m + "m";
  return h + "h " + String(m).padStart(2, "0") + "m";
}
function fmtHours(ms) {
  return (ms / 3600000).toFixed(2);
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function todayISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* =========================================================
   Timer control
   ========================================================= */
function startTimer(containerId, projectId, taskId) {
  if (isViewer()) return;
  if (state.running) stopTimer(true);
  state.running = { containerId: containerId, projectId: projectId, taskId: taskId, startedAt: now() };
  // Working on something is the moment it started, so fill these in - but only
  // when they are still untouched, never overriding what you set by hand.
  const t = findTask(state.running);
  if (t) {
    if (!t.started) t.started = todayISO();
    if (t.status === "Not Started") t.status = "In Progress";
  }
  save();
  render();
}

function stopTimer(skipRender) {
  if (!state.running) return;
  const task = findTask(state.running);
  const started = state.running.startedAt;
  const ended = now();
  state.running = null;
  if (task && ended - started >= 1000) {
    task.entries.push({ id: uid(), start: started, end: ended });
  }
  save();
  if (!skipRender) render();
}

function tick() {
  miniTick();
  if (!state.running) return;
  const elapsed = now() - state.running.startedAt;
  const clock = document.getElementById("runClock");
  if (clock) clock.textContent = fmtClock(elapsed);
  document.querySelectorAll("[data-live-task]").forEach(function (el) {
    const t = findTask({
      containerId: state.running.containerId,
      projectId: state.running.projectId,
      taskId: el.getAttribute("data-live-task")
    });
    if (t && el.getAttribute("data-live-task") === state.running.taskId) {
      el.textContent = fmtClock(taskTotalMs(t));
    }
  });
  document.querySelectorAll("[data-live-project]").forEach(function (el) {
    const p = findProject(state.running.containerId, el.getAttribute("data-live-project"));
    if (p) el.textContent = fmtDur(projectTotalMs(p));
  });
}

/* =========================================================
   Modal
   ========================================================= */
function openModal(opts) {
  const root = document.getElementById("modalRoot");
  const fields = opts.fields || [];
  let html = '<div class="modal"><div class="head">' + esc(opts.title) + "</div><div class=\"body\">";
  if (opts.intro) html += '<div class="hint">' + esc(opts.intro) + "</div>";
  fields.forEach(function (f, i) {
    html += '<label class="f">' + esc(f.label);
    const id = "mf_" + i;
    if (f.type === "textarea") {
      html += '<textarea id="' + id + '">' + esc(f.value || "") + "</textarea>";
    } else if (f.type === "select") {
      html += '<select id="' + id + '">';
      // Options are plain strings, or {value,label} when the label differs.
      (f.options || []).forEach(function (o) {
        const val = (o && typeof o === "object") ? o.value : o;
        const lab = (o && typeof o === "object") ? o.label : o;
        html += '<option value="' + esc(val) + '"' + (val === f.value ? " selected" : "") + ">" + esc(lab) + "</option>";
      });
      html += "</select>";
    } else if (f.type === "checks") {
      html += '<div class="checklist" id="' + id + '">';
      if (!(f.options || []).length) {
        html += '<span class="hint">' + esc(f.empty || "Nothing to choose from yet.") + "</span>";
      }
      (f.options || []).forEach(function (o) {
        const on = (f.value || []).indexOf(o.value) >= 0;
        html += '<label class="chk"><input type="checkbox" value="' + esc(o.value) + '"' +
          (on ? " checked" : "") + "> <span>" + esc(o.label) + "</span></label>";
      });
      html += "</div>";
    } else if (f.type === "combo") {
      // Free text, with previously used values offered as suggestions.
      html += '<input type="text" id="' + id + '" list="' + id + '_list" value="' + esc(f.value || "") +
        '" placeholder="' + esc(f.placeholder || "") + '">' +
        '<datalist id="' + id + '_list">' +
        (f.options || []).map(function (o) { return '<option value="' + esc(o) + '"></option>'; }).join("") +
        "</datalist>";
    } else if (f.type === "date") {
      html += '<input type="date" id="' + id + '" value="' + esc(f.value || "") + '">';
    } else if (f.type === "number") {
      html += '<input type="number" id="' + id + '" value="' + esc(f.value == null ? "" : f.value) + '"' +
        (f.min != null ? ' min="' + f.min + '"' : "") + (f.step ? ' step="' + f.step + '"' : "") + ">";
    } else {
      html += '<input type="text" id="' + id + '" value="' + esc(f.value || "") + '" placeholder="' + esc(f.placeholder || "") + '">';
    }
    html += "</label>";
  });
  html += '</div><div class="foot">' +
    '<button class="btn" id="mCancel">Cancel</button>' +
    '<button class="btn primary" id="mOk">' + esc(opts.okLabel || "Save") + "</button>" +
    "</div></div>";
  root.innerHTML = html;
  root.classList.add("on");

  const first = root.querySelector("input,select,textarea");
  if (first) { first.focus(); if (first.select) first.select(); }

  function close() {
    root.classList.remove("on");
    root.innerHTML = "";
    document.removeEventListener("keydown", onKey);
  }
  function submit() {
    const values = {};
    fields.forEach(function (f, i) {
      const el = document.getElementById("mf_" + i);
      if (f.type === "checks") {
        values[f.key] = el
          ? Array.from(el.querySelectorAll("input:checked")).map(function (x) { return x.value; })
          : [];
      } else {
        values[f.key] = el ? el.value : "";
      }
    });
    if (opts.validate) {
      const err = opts.validate(values);
      if (err) { alert(err); return; }
    }
    close();
    opts.onSubmit(values);
  }
  function onKey(e) {
    if (e.key === "Escape") close();
    if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") { e.preventDefault(); submit(); }
  }
  document.getElementById("mCancel").onclick = close;
  document.getElementById("mOk").onclick = submit;
  root.onclick = function (e) { if (e.target === root) close(); };
  document.addEventListener("keydown", onKey);
}

/* =========================================================
   Render: shell
   ========================================================= */
function render() {
  renderContainerTabs();
  renderRunBar();
  document.body.classList.toggle("viewer", isViewer());
  const mb = document.getElementById("miniBtn");
  if (mb) mb.classList.toggle("on", miniOpen());
  miniRender();
  const bar = document.getElementById("shareBar");
  bar.innerHTML = shareBannerHTML();
  bar.style.display = bar.innerHTML ? "flex" : "none";
  const rf = document.getElementById("shareRefresh");
  if (rf) rf.onclick = function () { refreshViewer(); };
  const pn = document.getElementById("sharePublish");
  if (pn) pn.onclick = function () {
    pn.textContent = "Publishing\u2026";
    publishNow().then(function (ok) {
      pn.textContent = "Publish now";
      if (!ok) alert("Could not write to the shared folder. Choose it again from Settings if it has moved.");
    });
  };

  const lx = LX();
  document.querySelectorAll("header .tab[data-view]").forEach(function (b) {
    const v = b.getAttribute("data-view");
    b.classList.toggle("active", v === state.ui.view);
    if (v === "projects") b.textContent = lx.projects;
    if (v === "members") b.textContent = lx.members;
  });
  const view = document.getElementById("view");
  if (state.ui.view === "reports") {
    view.innerHTML = reportsHTML();
    wireReports();
  } else if (state.ui.view === "members") {
    view.innerHTML = membersHTML();
    wireMembers();
  } else if (state.ui.view === "planner") {
    view.innerHTML = plannerHTML();
    wirePlanner();
  } else {
    view.innerHTML = projectsHTML();
    wireProjects();
  }
  wireFilters(view);
  restoreFilterFocus();
}

function renderContainerTabs() {
  const wrap = document.getElementById("containerTabs");
  wrap.innerHTML = state.containers.map(function (c) {
    return '<button class="tab' + (c.id === state.ui.containerId ? " active" : "") +
      '" data-container="' + c.id + '">' + esc(c.name) + "</button>";
  }).join("");
  wrap.querySelectorAll("[data-container]").forEach(function (b) {
    b.onclick = function () {
      const id = b.getAttribute("data-container");
      if (id === state.ui.containerId) { containerMenu(id); return; }
      state.ui.containerId = id;
      state.ui.projectId = null;
      save();
      render();
    };
  });
}

function containerMenu(id) {
  if (isViewer()) return;
  const c = findContainer(id);
  if (!c) return;
  openModal({
    title: "Container settings",
    intro: "Rename this container, change what it is for, or remove it entirely.",
    fields: [
      { key: "name", label: "Container name", value: c.name },
      { key: "kind", label: "What is it for?", type: "select",
        options: [
          { value: "work", label: "Work — projects, tasks, departments" },
          { value: "campaign", label: "Roleplay — campaigns, sessions, players" }
        ], value: kindOf(c) },
      { key: "currency", label: "Currency symbol", value: containerCurrency(c) },
      { key: "shared", label: "Visible to viewers when publishing", type: "select",
        options: ["No", "Yes"], value: c.shared ? "Yes" : "No" }
    ],
    okLabel: "Save",
    validate: function (v) { return v.name.trim() ? null : "Name cannot be empty."; },
    onSubmit: function (v) {
      c.name = v.name.trim();
      c.currency = v.currency.trim() || "\u20ac";
      c.shared = v.shared === "Yes";
      if (v.kind !== kindOf(c)) {
        const n = c.projects.length;
        if (n && !confirm("Switching this container to " + LEX[v.kind].kindName.toLowerCase() +
          " will re-map the statuses and activity types on its " + n +
          " item(s) to the new vocabulary. Your names, notes and logged time are untouched. Continue?")) {
          return;
        }
        c.kind = v.kind;
        normalise();
      }
      save();
      render();
    }
  });
  const foot = document.querySelector("#modalRoot .foot");
  if (foot && state.containers.length > 1) {
    const del = document.createElement("button");
    del.className = "btn danger";
    del.textContent = "Delete container";
    del.style.marginRight = "auto";
    del.onclick = function () {
      const n = c.projects.length;
      if (!confirm('Delete container "' + c.name + '" and its ' + n + " project(s), including all logged time?")) return;
      if (state.running && state.running.containerId === c.id) state.running = null;
      state.containers = state.containers.filter(function (x) { return x.id !== c.id; });
      state.ui.containerId = state.containers[0].id;
      state.ui.projectId = null;
      save();
      document.getElementById("modalRoot").classList.remove("on");
      document.getElementById("modalRoot").innerHTML = "";
      render();
    };
    foot.insertBefore(del, foot.firstChild);
  }
}

function renderRunBar() {
  const bar = document.getElementById("runbar");
  if (!state.running) { bar.classList.remove("on"); return; }
  const t = findTask(state.running);
  const p = findProject(state.running.containerId, state.running.projectId);
  const c = findContainer(state.running.containerId);
  if (!t || !p) { state.running = null; bar.classList.remove("on"); return; }
  bar.classList.add("on");
  document.getElementById("runWhat").textContent =
    t.title + "  ·  " + p.name + (c ? "  ·  " + c.name : "");
  document.getElementById("runClock").textContent = fmtClock(now() - state.running.startedAt);
}

              (out < 0 ? ' <span class="small">in credit</span>' : out === 0 ? ' <span class="small">settled</span>' : "") +

            '<td><div class="rowacts">' +
              '<button class="btn sm ghost" data-edit-account="' + a.id + '">Edit</button>' +
              '<button class="btn sm ghost danger" data-del-account="' + a.id + '">&times;</button>' +
            "</div></td></tr>";
          if (state.ui.openAccount === a.id) {
            row += '<tr><td colspan="7" style="background:var(--panel-2)">' +
              '<div class="small muted" style="margin-bottom:6px"><b>Movements on ' + esc(a.name) + "</b></div>" +
              (moves.length
                ? moves.slice().sort(function (x, y) { return (x.due || "").localeCompare(y.due || ""); })
                    .map(function (t) {
                      const charge = t.type === "Charge";
                      return '<div class="arcrow">' +
                        '<span class="badge ' + (charge ? "t-wait" : "t-done") + '">' + esc(t.type) + "</span>" +
                        '<span class="an">' + esc(t.title) + "</span>" +
                        '<span class="small muted">' + esc(t.due
                          ? new Date(t.due + "T00:00:00").toLocaleDateString(undefined,
                              { day: "numeric", month: "short", year: "numeric" })
                          : "no date") + "</span>" +
                        '<span class="small mono ' + (charge ? "owe" : "clear") + '">' +
                          (charge ? "+" : "\u2212") + money(t.cost, cur).replace(/^-/, "") + "</span></div>";
                    }).join("")
                : '<span class="hint">No payments or charges recorded yet. Add a task with the type ' +
                  "<b>Payment</b> or <b>Charge</b> and point it at this account.</span>") +
              "</td></tr>";
          }

        }).join("") + "</tbody></table></div>";
      html += '<div class="hint" style="margin-top:10px">Outstanding is worked out from the payments ' +
        "themselves, never stored, so it cannot drift. <b>Spent</b> counts money that has actually left \u2014 " +
        "a charge raises what you owe but is not spend until you pay it.</div>";

    html += "</div></div>";
  }

  /* --- documents --- */
  html += '<div class="card" style="margin-bottom:16px">' +

    '<div class="body">';

    html += '<div class="hint">Attaching documents needs the File System Access API, which this browser ' +
      "does not offer. Chrome or Edge on the desktop will work. Everything else in Ledger runs fine without it.</div>";
  } else {

      "No documents on the " + lex.project.toLowerCase() + " itself yet. Files are copied into your chosen folder.");

      esc(p.docFolder || "the folder you choose") + "</b>, with " + esc(lex.tasks.toLowerCase()) +

  }

  if (lex.roster) {

      html += '<div class="hint">No characters yet. Add one to record who is playing whom.</div>';

          get: function (r) { return memberName(activeContainer(), r.memberId); } },
        { key: "state", label: "State", type: "select", get: function (r) { return r.state; } },

      html += '<div style="overflow:auto"><table>' + tableHeadHTML("cast", ccols, p.roster) + "<tbody>" +

  html +=
    '<div class="card">' +

        '<button class="btn sm primary" data-act="newTask">+ ' + esc(lex.task) + "</button></div>";

  if (!p.tasks.length) {
    html += '<div class="empty">No ' + esc(lex.tasks.toLowerCase()) +
      " yet. Add one, then hit <b>Start</b> to track time against it.</div>";
  } else {
    const c0 = activeContainer();
    const tcols = [

      { key: "type", label: lex.typeLabel, type: "select", get: function (t) { return t.type; } },
      { key: "status", label: "Status", type: "select", get: function (t) { return t.status; } },
      { key: "who", label: "Assigned to", type: "select",
        get: function (t) { return memberName(c0, t.assigneeId); } },
      { label: "Dates" },
      { key: "cost", label: "Cost", type: "text", right: true,
        get: function (t) { return t.cost ? String(t.cost) : ""; } },

    ];
    const tshown = applyFilters("tasks", tcols, p.tasks);
    html += filterNoteHTML("tasks", tshown.length, p.tasks.length);
    html += '<div style="overflow:auto"><table>' +
      tableHeadHTML("tasks", tcols, p.tasks) + "<tbody>" +
      (tshown.length
        ? tshown.map(function (t) { return taskRowHTML(p, t); }).join("")
        : '<tr><td colspan="8" class="nomatch">Nothing matches these filters.</td></tr>') +
      "</tbody></table></div>";
  }
  html += "</div>";
  return html;
}

function milestoneSort(a, b) {
  if (a.done !== b.done) return a.done ? 1 : -1;
  if (!a.due) return 1;
  if (!b.due) return -1;
  return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
}

function milestoneHTML(m, p) {
  let dueCls = "";
  let dueTxt = m.due ? new Date(m.due + "T00:00:00").toLocaleDateString() : "no due date";
  if (m.due && !m.done) {
    const days = Math.ceil((new Date(m.due + "T23:59:59") - now()) / 86400000);
    if (days < 0) { dueCls = "due-over"; dueTxt += " (overdue)"; }
    else if (days <= 7) { dueCls = "due-soon"; dueTxt += days === 0 ? " (today)" : " (in " + days + "d)"; }
  }
  const lex = LX();
  const linked = (p && p.tasks || []).filter(function (t) {
    return (t.arcIds || []).indexOf(m.id) >= 0;
  });
  const open = state.ui.openArc === m.id;
  let html = '<div class="ms' + (m.done ? " done" : "") + '">' +
    '<input type="checkbox" data-ms-toggle="' + m.id + '"' + (m.done ? " checked" : "") + ">" +
    '<div class="lbl arclbl" data-arc="' + m.id + '" title="Show linked ' +
      esc(lex.tasks.toLowerCase()) + '">' + esc(m.label) +
      '<span class="arccount">' + linked.length + "</span></div>" +
    '<div class="small ' + dueCls + '">' + esc(dueTxt) + "</div>" +
    '<button class="btn sm ghost" data-ms-edit="' + m.id + '">Edit</button>' +
    '<button class="btn sm ghost danger" data-ms-del="' + m.id + '">&times;</button>' +
    "</div>";
  if (open) {
    let ms = 0;
    linked.forEach(function (t) { ms += taskTotalMs(t); });
    html += '<div class="arcbox">';
    if (!linked.length) {
      html += '<span class="hint">No ' + esc(lex.tasks.toLowerCase()) + " linked to this " +
        esc(lex.milestone.toLowerCase()) + " yet. Link them when you add or edit one.</span>";
    } else {
      html += '<div class="small muted" style="margin-bottom:6px"><b>' + linked.length + " " +
        esc(linked.length === 1 ? lex.task.toLowerCase() : lex.tasks.toLowerCase()) +
        "</b> · " + fmtDur(ms) + " logged</div>";
      html += linked.slice().sort(function (a, b) {
        return (a.due || "9999").localeCompare(b.due || "9999");
      }).map(function (t) {
        return '<div class="arcrow">' +
          '<span class="badge ' + lex.taskStatusClass[t.status] + '">' + esc(t.status) + "</span>" +
          '<span class="an">' + esc(t.title) + "</span>" +
          '<span class="small muted">' + esc(t.due
            ? new Date(t.due + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })
            : "no date") + "</span>" +
          '<span class="small mono">' + fmtDur(taskTotalMs(t)) + "</span></div>";
      }).join("");
    }
    html += '<div class="docsub"><div class="small muted" style="margin:6px 0 4px"><b>Documents</b></div>' +
      docsHTML(m.docs, "milestone", m.id,
        "Nothing attached to this " + esc(lex.milestone.toLowerCase()) + " yet.") + "</div>";
    html += "</div>";
  }
  return html;
}

/** Short "12 Aug" style date, with overdue/soon flagging for live tasks. */
function dueInfo(dateStr, closed) {
  if (!dateStr) return { text: "—", cls: "" };
  const d = new Date(dateStr + "T00:00:00");
  const text = d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  if (closed) return { text: text, cls: "" };
  const days = Math.ceil((new Date(dateStr + "T23:59:59") - now()) / 86400000);
  if (days < 0) return { text: text + " · overdue", cls: "due-over" };
  if (days === 0) return { text: text + " · today", cls: "due-soon" };
  if (days <= 7) return { text: text + " · " + days + "d", cls: "due-soon" };
  return { text: text, cls: "" };
}

      '<td><div class="rowacts">' +
        (running

              esc(new Date(e.end).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })) + "</div>" +

  return row;
}

/* =========================================================
   Wiring: projects view
   ========================================================= */
function wireProjects() {
  const view = document.getElementById("view");
  const c = activeContainer();

  // Reordering the list is just reordering the array behind it. The drag
  // moves the DOM node and only rewrites the array on drop, so nothing
  // re-renders mid-gesture and the node being dragged never disappears.
  view.querySelectorAll("[data-grip]").forEach(function (g) {
    g.onclick = function (e) { e.stopPropagation(); };
    g.onpointerdown = function (e) {
      if (isViewer() || e.button !== 0) return;
      e.preventDefault();
      e.stopPropagation();
      const item = g.closest(".pitem");
      const list = item.parentElement;
      if (!item || !list) return;
      let moved = false;
      item.classList.add("dragging");

      function onMove(ev) {
        moved = true;
        const others = Array.from(list.querySelectorAll(".pitem")).filter(function (x) { return x !== item; });
        let placed = false;
        for (let i = 0; i < others.length; i++) {
          const box = others[i].getBoundingClientRect();
          if (ev.clientY < box.top + box.height / 2) {
            list.insertBefore(item, others[i]);
            placed = true;
            break;
          }
        }
        if (!placed) list.appendChild(item);
      }
      function onUp() {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        item.classList.remove("dragging");
        if (!moved) return;
        // Selecting a project on the click that ends a drag would be wrong.
        lastReorder = now();
        const order = Array.from(list.querySelectorAll(".pitem")).map(function (x) {
          return x.getAttribute("data-open");
        });
        c.projects.sort(function (a, b) { return order.indexOf(a.id) - order.indexOf(b.id); });
        save();
        render();
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
    };
  });

  view.querySelectorAll("[data-open]").forEach(function (el) {
    el.onclick = function () {
      if (now() - lastReorder < 300) return;
      state.ui.projectId = el.getAttribute("data-open");
      state.ui.openEntries = null;
      save();
      render();
    };
  });

  view.querySelectorAll('[data-act="newProject"]').forEach(function (b) {
    b.onclick = function () {
      const lex = LX(c);
      openModal({
        title: lex.newProject + " in " + c.name,
        fields: [
          { key: "name", label: lex.project + " name", value: "",
            placeholder: kindOf(c) === "campaign" ? "e.g. Curse of Strahd" : "e.g. Q3 Budget Automation" },
          { key: "person", label: lex.personLabel, value: "", placeholder: lex.personPh },
          { key: "department", label: lex.deptLabel, value: "", placeholder: lex.deptPh },
          { key: "status", label: "Status", type: "select", options: lex.statuses, value: lex.statuses[0] },
          { key: "description", label: "Description", type: "textarea", value: "" }
        ],
        okLabel: "Create " + lex.project.toLowerCase(),
        validate: function (v) { return v.name.trim() ? null : lex.project + " name is required."; },
        onSubmit: function (v) {
          const pr = {
            id: uid(), name: v.name.trim(), person: v.person.trim(), department: v.department.trim(),
            status: v.status, description: v.description, milestones: [], tasks: [], roster: []
          };
          c.projects.push(pr);
          state.ui.projectId = pr.id;
          save();
          render();
        }
      });
    };
  });

  const p = activeProject();
  if (!p) return;

  view.querySelectorAll("[data-field]").forEach(function (el) {
    el.onchange = function () {
      p[el.getAttribute("data-field")] = el.value;
      save();
      if (el.getAttribute("data-field") === "status") render();
    };
  });

  const rename = view.querySelector('[data-act="renameProject"]');
  if (rename) rename.onclick = function () {
    openModal({
      title: "Rename " + LX(c).project.toLowerCase(),
      fields: [{ key: "name", label: LX(c).project + " name", value: p.name }],
      validate: function (v) { return v.name.trim() ? null : "Name cannot be empty."; },
      onSubmit: function (v) { p.name = v.name.trim(); save(); render(); }
    });
  };

  const delp = view.querySelector('[data-act="deleteProject"]');
  if (delp) delp.onclick = function () {
    if (!confirm("Delete " + LX(c).project.toLowerCase() + ' "' + p.name + '" with all its ' +
      LX(c).tasks.toLowerCase() + " and logged time?")) return;
    if (state.running && state.running.projectId === p.id) state.running = null;
    c.projects = c.projects.filter(function (x) { return x.id !== p.id; });
    state.ui.projectId = null;
    save();
    render();
  };

  /* milestones */
  const newMs = view.querySelector('[data-act="newMilestone"]');
  if (newMs) newMs.onclick = function () {
    openModal({
      title: "New " + LX(c).milestone.toLowerCase(),
      fields: [
        { key: "label", label: LX(c).milestone, value: "",
          placeholder: kindOf(c) === "campaign" ? "e.g. The Death House" : "e.g. Draft sent for review" },
        { key: "due", label: kindOf(c) === "campaign" ? "Target date" : "Due date", type: "date", value: "" }
      ],
      validate: function (v) { return v.label.trim() ? null : LX(c).milestone + " label is required."; },
      onSubmit: function (v) {
        p.milestones.push({ id: uid(), label: v.label.trim(), due: v.due, done: false });
        save();
        render();
      }
    });
  };
  view.querySelectorAll("[data-arc]").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-arc");
      state.ui.openArc = state.ui.openArc === id ? null : id;
      render();
    };
  });
  view.querySelectorAll("[data-ms-toggle]").forEach(function (el) {
    el.onchange = function () {
      const m = p.milestones.find(function (x) { return x.id === el.getAttribute("data-ms-toggle"); });
      if (m) { m.done = el.checked; save(); render(); }
    };
  });
  view.querySelectorAll("[data-ms-edit]").forEach(function (el) {
    el.onclick = function () {
      const m = p.milestones.find(function (x) { return x.id === el.getAttribute("data-ms-edit"); });
      if (!m) return;
      openModal({
        title: "Edit " + LX(c).milestone.toLowerCase(),
        fields: [
          { key: "label", label: LX(c).milestone, value: m.label },
          { key: "due", label: kindOf(c) === "campaign" ? "Target date" : "Due date", type: "date", value: m.due }
        ],
        validate: function (v) { return v.label.trim() ? null : LX(c).milestone + " label is required."; },
        onSubmit: function (v) { m.label = v.label.trim(); m.due = v.due; save(); render(); }
      });
    };
  });
  view.querySelectorAll("[data-ms-del]").forEach(function (el) {
    el.onclick = function () {
      const id = el.getAttribute("data-ms-del");
      const m = p.milestones.find(function (x) { return x.id === id; });
      if (!m || !confirm("Delete " + LX(c).milestone.toLowerCase() + ' "' + m.label + '"?')) return;
      p.milestones = p.milestones.filter(function (x) { return x.id !== id; });
      save();
      render();
    };
  });

  /* accounts */
  function accountModal(existing) {
    openModal({
      title: existing ? "Edit account" : "New bill or balance",
      intro: existing ? null : "A one-off bill is paid down to zero. A running balance can also take new charges.",
      fields: [
        { key: "name", label: "Name", value: existing ? existing.name : "",

  const newTask = view.querySelector('[data-act="newTask"]');
  if (newTask) newTask.onclick = function () {

      validate: validateTaskDates,

  view.querySelectorAll("[data-add-time]").forEach(function (b) {

  view.querySelectorAll("[data-del-entry]").forEach(function (b) {

      save();
      render();
    };
  });
}

/* =========================================================
   Reports
   ========================================================= */
const RANGES = {
  all: "All time",
  today: "Today",
  week: "This week",
  month: "This month",
  last7: "Last 7 days",
  last30: "Last 30 days"
};

function rangeBounds(key) {
  const d = new Date();
  const startOfDay = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  switch (key) {
    case "today": return [startOfDay, Infinity];
    case "week": {
      const dow = (d.getDay() + 6) % 7; // Monday = 0
      return [startOfDay - dow * 86400000, Infinity];
    }
    case "month": return [new Date(d.getFullYear(), d.getMonth(), 1).getTime(), Infinity];
    case "last7": return [startOfDay - 6 * 86400000, Infinity];
    case "last30": return [startOfDay - 29 * 86400000, Infinity];
    default: return [-Infinity, Infinity];
  }
}







/* =========================================================
   Mini control
   -----------------------------------------------------------
   A small always-on-top window holding just the three pickers
   and a start/stop button, so time can be logged without
   hunting for the Ledger tab.

   A page cannot raise itself above other windows by ordinary
   means. Document Picture-in-Picture can, and is the whole
   reason this works; where it is missing we fall back to an
   ordinary popup, which behaves the same but sits in the
   normal window order.
   ========================================================= */

let miniWin = null;

function miniSupported() {
  return !!(window.documentPictureInPicture && window.documentPictureInPicture.requestWindow);
}
function miniOpen() { return !!(miniWin && !miniWin.closed); }

/** The pickers cascade: container -> project -> task. */
function miniChoice() {
  const st = state.ui.mini || {};
  const c = findContainer(st.containerId) || activeContainer();
  const p = (c && (c.projects.find(function (x) { return x.id === st.projectId; }) || c.projects[0])) || null;
  const t = (p && (p.tasks.find(function (x) { return x.id === st.taskId; }) ||
                   p.tasks.filter(function (x) { return !isTaskClosed(x); })[0] || p.tasks[0])) || null;
  return { c: c, p: p, t: t };
}

function miniBodyHTML() {
  const sel = miniChoice();
  const run = state.running;
  const runTask = run ? findTask(run) : null;
  const lex = LX(sel.c);

  function opts(list, cur, label) {
    return list.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (cur && x.id === cur.id ? " selected" : "") + ">" +
        esc(label(x)) + "</option>";
    }).join("");
  }

  let h = '<div class="m-wrap">';
  h += '<select id="mC">' + opts(state.containers, sel.c, function (x) { return x.name; }) + "</select>";
  h += '<select id="mP">' + (sel.c && sel.c.projects.length
        ? opts(sel.c.projects, sel.p, function (x) { return x.name; })
        : '<option value="">no ' + esc(lex.projects.toLowerCase()) + "</option>") + "</select>";
  h += '<select id="mT">' + (sel.p && sel.p.tasks.length
        ? opts(sel.p.tasks.filter(function (x) { return !isTaskClosed(x); }).concat(
               sel.p.tasks.filter(isTaskClosed)), sel.t, function (x) { return x.title; })
        : '<option value="">no ' + esc(lex.tasks.toLowerCase()) + "</option>") + "</select>";

  h += '<div class="m-now">' + (run && runTask
        ? '<span class="m-dot"></span><span class="m-name">' + esc(runTask.title) + "</span>"
        : '<span class="m-idle">Nothing running</span>') + "</div>";
  h += '<div class="m-clock" id="mClock">' + (run ? fmtClock(now() - run.startedAt) : "0:00:00") + "</div>";
  h += '<button id="mBtn" class="' + (run ? "stop" : "go") + '"' +
       (!sel.t && !run ? " disabled" : "") + ">" + (run ? "Stop" : "Start") + "</button>";
  h += "</div>";
  return h;
}

const MINI_CSS = `
  *{box-sizing:border-box}
  body{margin:0;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:#2e3542;color:#efebe3;
       -webkit-font-smoothing:antialiased}
  .m-wrap{display:flex;flex-direction:column;gap:6px;padding:10px}
  select{width:100%;padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.18);
         background:#242a35;color:#efebe3;font:inherit}
  select:focus{outline:2px solid rgba(210,164,91,.45);border-color:#d2a45b}
  .m-now{display:flex;align-items:center;gap:6px;min-height:18px;font-size:12px;margin-top:2px}
  .m-dot{width:8px;height:8px;border-radius:50%;background:#4ec27f;flex:none;
